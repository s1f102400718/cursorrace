<title>Helper Items Sandbox</title>
<style>
/* Layout: item list left, 16:9 arena center, notes right. Single dark arcade theme by choice. */
:root{
  --bg:#07090f; --arena:#0d1220; --grid:#141b2d; --fg:#e6ecf5; --dim:#7d8aa3;
  --wall:#2b3650; --wall-edge:#5a6d94; --haz:#ff3b5c; --bullet:#ff5c7a; --laser:#ff4fd8; --help:#49e07c; --help2:#4fd3ff; --emit:#ffb84d; --player:#5ee1ff;
  --panel:#0f1526; --line:#243052; --sel:#1b2742;
  --font:ui-monospace,Consolas,"Chakra Petch",monospace; color-scheme:dark;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#wrap{display:flex;height:100%}
#list{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;font-size:12.5px;cursor:auto}
#list h2{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:12px 12px 4px}
#list .it{padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;border-left:3px solid transparent}
#list .it:hover{background:var(--sel)}
#list .it.sel{background:var(--sel);border-left-color:var(--help)}
#list .code{color:var(--dim);min-width:36px;font-size:11px}
#list .kind{margin-left:auto;font-size:10px;color:var(--dim)}
#stage{flex:1;min-width:0;position:relative}
#c{display:block;width:100%;height:100%;cursor:none;touch-action:none;user-select:none}
#hud{position:absolute;left:14px;top:10px;pointer-events:none;font-size:14px;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;line-height:1.5}
#hud .big{font-size:28px;line-height:1.1}
#hud .dim{color:var(--dim);font-weight:500}
#panel{width:280px;flex:none;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px;box-sizing:border-box;overflow-y:auto;font-size:13px;cursor:auto}
#panel h1{font-size:16px;margin:0 0 2px;letter-spacing:.06em}
#panel .code{color:var(--dim);font-size:12px;margin-bottom:8px}
#panel .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--help);color:var(--help);margin:0 4px 10px 0}
#panel p{margin:0 0 12px;color:var(--dim);line-height:1.55}
#panel .how{color:var(--fg);background:#182038;border-radius:6px;padding:8px 10px}
#panel button{width:100%;background:#182038;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;margin:4px 0;cursor:pointer}
#panel button:hover{border-color:var(--player)}
#panel hr{border:0;border-top:1px solid var(--line);margin:12px 0}
@media (max-width:900px){ #wrap{flex-wrap:wrap} #list{width:50%;height:40%;order:2} #panel{width:50%;height:40%;order:3;border-left:0} #stage{width:100%;height:60%;order:1;flex:none} }
</style>
<div id="wrap">
  <div id="list"></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="big" id="hTime">0.0</div>
      <div class="dim">生存秒 · 死亡 <span id="hDeaths">0</span> · 無効化した被弾 <span id="hSaved">0</span></div>
      <div class="dim" id="hState"></div>
    </div>
  </div>
  <div id="panel">
    <h1 id="pName"></h1>
    <div class="code" id="pCode"></div>
    <div id="pBadges"></div>
    <p id="pDesc"></p>
    <p class="how" id="pHow"></p>
    <hr>
    <button id="reset">シーンをリセット</button>
    <p>死んだら1秒無敵でその場復帰（IT-7 以外）。↑↓ キーで切替。</p>
    <p id="pMulti"></p>
  </div>
</div>
<script>
'use strict';
const T = { W: 1280, H: 720, HEAD_R: 4, TRAIL_LIFE: 0.6, TRAIL_GAP: 5, INVULN: 1.0, PAD_R: 46 };
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const osc = (t, period, phase) => (1 - Math.cos(TAU * (t / period + (phase || 0)))) / 2;
const frac = v => (v % 1 + 1) % 1;
const hash = k => frac(Math.sin(k * 12.9898 + 78.233) * 43758.5453);
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function segPointDist(ax, ay, bx, by, px, py){ const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy; let u = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; u = u < 0 ? 0 : u > 1 ? 1 : u; return Math.hypot(ax + dx * u - px, ay + dy * u - py); }
function orient(ax, ay, bx, by, cx, cy){ return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax); }
function segIntersect(ax, ay, bx, by, cx, cy, dx, dy){ const o1 = orient(ax, ay, bx, by, cx, cy), o2 = orient(ax, ay, bx, by, dx, dy), o3 = orient(cx, cy, dx, dy, ax, ay), o4 = orient(cx, cy, dx, dy, bx, by); return (o1 * o2 < 0) && (o3 * o4 < 0); }
function segSegDist(ax, ay, bx, by, cx, cy, dx, dy){ if (segIntersect(ax, ay, bx, by, cx, cy, dx, dy)) return 0; return Math.min(segPointDist(ax, ay, bx, by, cx, cy), segPointDist(ax, ay, bx, by, dx, dy), segPointDist(cx, cy, dx, dy, ax, ay), segPointDist(cx, cy, dx, dy, bx, by)); }
function segRect(x0, y0, x1, y1, xmin, ymin, xmax, ymax){ let t0 = 0, t1 = 1; const dx = x1 - x0, dy = y1 - y0, p = [-dx, dx, -dy, dy], q = [x0 - xmin, xmax - x0, y0 - ymin, ymax - y0]; for (let i = 0; i < 4; i++){ if (p[i] === 0){ if (q[i] < 0) return false; } else { const r = q[i] / p[i]; if (p[i] < 0){ if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; } } } return true; }
function hit(pr, ax, ay, bx, by, r){ if (pr.on === false) return false; if (pr.k === 'rect') return segRect(ax, ay, bx, by, pr.x - r, pr.y - r, pr.x + pr.w + r, pr.y + pr.h + r); if (pr.k === 'circ') return segPointDist(ax, ay, bx, by, pr.x, pr.y) <= pr.r + r; if (pr.k === 'cap') return segSegDist(ax, ay, bx, by, pr.ax, pr.ay, pr.bx, pr.by) <= pr.r + r; return false; }
function sweepHit(ps, ax, ay, bx, by){ for (const pr of ps) if (hit(pr, ax, ay, bx, by, T.HEAD_R)) return pr; return null; }

// ===== ハザード（見本用、本編と同じ挙動） =====
const EMITTERS = new Set(['danmaku', 'shooter', 'rain', 'rotlaser']);
function hazPrims(p, t, out){
  switch (p.t){
    case 'wall': out.push({ k: 'rect', x: p.x, y: p.y, w: p.w, h: p.h, c: 'wall', src: p }); break;
    case 'orbit': { const a = (p.phase || 0) * TAU + t * p.rpm * TAU / 60; out.push({ k: 'circ', x: p.x + Math.cos(a) * p.R, y: p.y + Math.sin(a) * p.R, r: p.r, c: 'haz', src: p }); break; }
    case 'bar': { const n = p.blades || 1, base = t * p.rpm * TAU / 60; for (let k = 0; k < n; k++){ const a = base + k * TAU / n, cx = Math.cos(a) * p.len / 2, sy = Math.sin(a) * p.len / 2; out.push({ k: 'cap', ax: p.x - cx, ay: p.y - sy, bx: p.x + cx, by: p.y + sy, r: p.thick / 2, c: 'haz', src: p }); } break; }
    case 'slider': { const s = osc(t, p.period, p.phase); out.push({ k: 'rect', x: p.x + (p.dx || 0) * s, y: p.y + (p.dy || 0) * s, w: p.w, h: p.h, c: 'haz', src: p }); break; }
    case 'pulser': { const s = osc(t, p.period, p.phase); out.push({ k: 'circ', x: p.x, y: p.y, r: p.rmin + (p.rmax - p.rmin) * s, c: 'haz', src: p }); break; }
    case 'danmaku': { const kmax = Math.floor(t / p.interval), kmin = Math.max(0, Math.ceil((t - p.life) / p.interval)); for (let k = kmin; k <= kmax; k++){ const age = t - k * p.interval; if (age < 0 || age > p.life) continue; for (let i = 0; i < p.n; i++){ const a = (k * p.spin + i * 360 / p.n) * DEG, x = p.x + Math.cos(a) * p.speed * age, y = p.y + Math.sin(a) * p.speed * age; if (x < -10 || y < -10 || x > T.W + 10 || y > T.H + 10) continue; out.push({ k: 'circ', x, y, r: p.r, c: 'bullet', ox: p.x, oy: p.y, src: p }); } } break; }
    case 'shooter': { const nb = Math.ceil(p.range / (p.speed * p.interval)), f = frac(t / p.interval); for (let k = 0; k < nb; k++){ const d = (f + k) * p.interval * p.speed; if (d > p.range) break; out.push({ k: 'circ', x: p.x + p.dx * d, y: p.y + p.dy * d, r: p.r, c: 'bullet', ox: p.x, oy: p.y, src: p }); } break; }
    case 'rain': { const life = (T.H + 2 * p.r) / p.speed, kmax = Math.floor(t / p.interval), kmin = Math.max(0, Math.ceil((t - life) / p.interval)); for (let k = kmin; k <= kmax; k++){ const age = t - k * p.interval; if (age < 0) continue; const y = -p.r + p.speed * age; if (y > T.H + p.r) continue; const x = p.x + hash(k * 7 + 131) * p.w; out.push({ k: 'circ', x, y, r: p.r, c: 'bullet', ox: x, oy: -p.r, src: p }); } break; }
    case 'rotlaser': { const cyc = p.on + p.warn + p.off, ph = frac(t / cyc) * cyc, a = t * p.rpm * TAU / 60; if (ph >= p.warn && ph < p.warn + p.on) out.push({ k: 'cap', ax: p.x, ay: p.y, bx: p.x + Math.cos(a) * p.len, by: p.y + Math.sin(a) * p.len, r: p.thick / 2, c: 'laser', src: p }); break; }
  }
}
const anchor = p => ({ x: p.x + (p.w ? p.w / 2 : 0), y: p.y + (p.h ? p.h / 2 : 0) });
// 見本の障害物セット
const BASE = () => [
  { t: 'wall', x: 300, y: 0, w: 40, h: 300 }, { t: 'wall', x: 940, y: 420, w: 40, h: 300 },
  { t: 'orbit', x: 500, y: 520, R: 90, r: 16, rpm: 40 }, { t: 'orbit', x: 800, y: 200, R: 90, r: 16, rpm: -40, phase: 0.5 },
  { t: 'bar', x: 640, y: 360, len: 300, thick: 14, rpm: 18 },
  { t: 'slider', x: 1100, y: 60, w: 40, h: 160, dy: 440, period: 2.4 },
  { t: 'pulser', x: 160, y: 560, rmin: 16, rmax: 80, period: 2 },
];
const BULLETS = () => [
  { t: 'danmaku', x: 640, y: 360, n: 16, speed: 170, interval: 0.8, r: 6, spin: 9, life: 5 },
  { t: 'shooter', x: 200, y: -20, dx: 0, dy: 1, speed: 380, interval: 0.8, r: 10, range: 760 },
  { t: 'wall', x: 300, y: 0, w: 40, h: 300 }, { t: 'wall', x: 940, y: 420, w: 40, h: 300 },
];

// ===== アイテム図鑑 =====
// 各項目: code, name, kind(設置/選択/拾う/描く), det, desc, how, multi, scene() → { hazards, items }, 以下フック
//   onClick(sc, pt), onDragEnd(sc, a, b), filterPieces(sc, hazards)→描画判定対象, timeFor(sc, p, t)→そのピースの時刻, filterPrims(sc, ps)→判定対象, immune(sc, env)→無敵か, onHit(sc)→被弾を無効化したら true, draw(sc, env, layer)
const ITEMS = [
{ code: 'IT-1', name: 'ハンマー', kind: '選択', det: true, desc: '設置フェーズで既存の設置物を1つ選んで撤去する。初期の壁は壊せない想定。', how: 'アリーナ上の障害物をクリック → 消える（1回）。', multi: 'マルチ: 選んだピースの owner を無効化するだけ。相手の渾身の一手を消せるので強い。箱に入る頻度を下げるか、「自分の設置物だけ」に制限するか。',
  scene: () => ({ hazards: BASE(), items: [], uses: 1 }),
  onClick(sc, pt){ if (sc.uses <= 0) return; const ps = []; for (const h of sc.hazards) hazPrims(h, sc.t, ps); const hitP = ps.find(pr => pr.c !== 'wall' && hit(pr, pt.x, pt.y, pt.x, pt.y, 18)); if (hitP){ sc.hazards = sc.hazards.filter(h => h !== hitP.src); sc.uses--; sc.fx.push({ x: pt.x, y: pt.y, t: sc.t }); } },
  draw(sc, env, L){ if (L !== 'over') return; for (const f of sc.fx){ const a = sc.t - f.t; if (a > 0.5) continue; ctx.strokeStyle = C.help; ctx.globalAlpha = 1 - a * 2; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, 20 + a * 120, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; } if (sc.uses > 0 && env.have){ ctx.strokeStyle = C.help; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(env.cur.x, env.cur.y, 18, 0, TAU); ctx.stroke(); ctx.setLineDash([]); } } },
{ code: 'IT-2', name: '爆弾', kind: '設置', det: true, desc: '置いた場所の半径内にある設置物をまとめて撤去する。密集地帯の掃除用。', how: 'アリーナをクリックして置く → 半径140px内の障害物が消える（1回）。', multi: 'マルチ: 設置フェーズに即時発動。範囲が見えるので「どこを消すか」の駆け引きになる。',
  scene: () => ({ hazards: BASE(), items: [], uses: 1, R: 140 }),
  onClick(sc, pt){ if (sc.uses <= 0) return; sc.uses--; sc.fx.push({ x: pt.x, y: pt.y, t: sc.t }); sc.hazards = sc.hazards.filter(h => h.t === 'wall' || Math.hypot(anchor(h).x - pt.x, anchor(h).y - pt.y) > sc.R); },
  draw(sc, env, L){ if (L !== 'over') return; for (const f of sc.fx){ const a = sc.t - f.t; if (a > 0.6) continue; ctx.fillStyle = C.help; ctx.globalAlpha = 0.5 * (1 - a / 0.6); ctx.beginPath(); ctx.arc(f.x, f.y, sc.R * Math.min(1, a * 4), 0, TAU); ctx.fill(); ctx.globalAlpha = 1; } if (sc.uses > 0 && env.have){ ctx.strokeStyle = C.help; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.arc(env.cur.x, env.cur.y, sc.R, 0, TAU); ctx.stroke(); ctx.setLineDash([]); } } },
{ code: 'IT-3', name: '防弾ネット', kind: '設置', det: true, desc: '弾を止める網。弾は壁を貫通するが、この網は通れない。触れても死なない。', how: '網の影側に入って弾幕と砲台の弾が止まるのを見る。', multi: 'マルチ: 弾幕対策の唯一の手段になる。網の後ろが安全地帯になるので、置く場所がコース設計そのもの。',
  scene: () => ({ hazards: BULLETS(), items: [{ t: 'net', x: 420, y: 200, w: 16, h: 320 }, { t: 'net', x: 120, y: 380, w: 200, h: 16 }] }),
  filterPrims(sc, ps){ return ps.filter(pr => pr.c !== 'bullet' || !sc.items.some(n => segRect(pr.ox, pr.oy, pr.x, pr.y, n.x, n.y, n.x + n.w, n.y + n.h))); },
  draw(sc, env, L){ if (L !== 'under') return; for (const n of sc.items){ ctx.save(); ctx.fillStyle = C.help; ctx.globalAlpha = 0.35; ctx.fillRect(n.x, n.y, n.w, n.h); ctx.globalAlpha = 0.9; ctx.strokeStyle = C.help; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.strokeRect(n.x, n.y, n.w, n.h); ctx.restore(); } } },
{ code: 'IT-4', name: '聖域', kind: '設置', det: true, desc: '円の中にいる間はすべてのハザードが無効。息を整える場所。', how: '緑の円に入ると、障害物が当たっても死なない。', multi: 'マルチ: 滞在時間制限（例 3秒で消える）か、1人しか入れない等の制約が要る。無いと全員がそこで待つ。',
  scene: () => ({ hazards: BASE(), items: [{ t: 'sanct', x: 640, y: 560, r: 70 }] }),
  immune(sc, env){ return env.have && sc.items.some(s => Math.hypot(env.cur.x - s.x, env.cur.y - s.y) < s.r); },
  draw(sc, env, L){ if (L !== 'under') return; for (const s of sc.items){ ctx.save(); const inside = this.immune(sc, env); ctx.fillStyle = C.help; ctx.globalAlpha = inside ? 0.22 : 0.1; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); ctx.globalAlpha = 0.8; ctx.strokeStyle = C.help; ctx.lineWidth = 2; ctx.stroke(); text('SAFE', s.x, s.y, 14, C.help, 'center'); ctx.restore(); } } },
{ code: 'IT-5', name: 'スロー域', kind: '設置', det: true, desc: '区画の中にある障害物は時間が1/3の速さで流れる。弾幕も中に入るとゆっくり。', how: '区画内の周回・バーが遅くなっているのを見る。', multi: 'マルチ: 範囲指定で置く。全員に同じ効果なので同期は問題なし。',
  scene: () => ({ hazards: BASE(), items: [{ t: 'slow', x: 380, y: 60, w: 520, h: 420, k: 1 / 3 }] }),
  timeFor(sc, p, t){ const a = anchor(p); return sc.items.some(z => inRect(a.x, a.y, z)) ? t * z0(sc).k : t; },
  draw(sc, env, L){ if (L !== 'under') return; for (const z of sc.items) zone(z, C.help2, '×1/3 SLOW'); } },
{ code: 'IT-6', name: '凍結', kind: '選択', det: true, desc: '設置物1つを選んで、そのラウンド中は動きを止める。撤去より弱いが、止まった物は読みやすい。', how: '障害物をクリック → その場で停止（1回）。', multi: 'マルチ: ハンマーの弱い版として箱に入れやすい。凍った弾幕は「弾が出ない」になる。',
  scene: () => ({ hazards: BASE(), items: [], uses: 1 }),
  onClick(sc, pt){ if (sc.uses <= 0) return; const ps = []; for (const h of sc.hazards) hazPrims(h, sc.t, ps); const hitP = ps.find(pr => pr.c !== 'wall' && hit(pr, pt.x, pt.y, pt.x, pt.y, 18)); if (hitP){ hitP.src.frozenT = sc.t; sc.uses--; } },
  timeFor(sc, p, t){ return p.frozenT !== undefined ? p.frozenT : t; },
  draw(sc, env, L){ if (L !== 'over') return; for (const h of sc.hazards) if (h.frozenT !== undefined){ const a = anchor(h); ctx.save(); ctx.strokeStyle = C.help2; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(a.x, a.y, 24, 0, TAU); ctx.stroke(); text('❄', a.x, a.y, 18, C.help2, 'center'); ctx.restore(); } if (sc.uses > 0 && env.have){ ctx.strokeStyle = C.help2; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(env.cur.x, env.cur.y, 18, 0, TAU); ctx.stroke(); ctx.setLineDash([]); } } },
{ code: 'IT-7', name: '復活パッド', kind: '設置', det: true, desc: '死んでもこのパッドから1回だけ復帰できる。マルチの「死＝脱落」の例外。', how: '死ぬと幽霊になり、パッドにカーソルを戻すと復帰（1回）。2回目は通常どおり。', multi: 'マルチ: 置いた人だけ使えるか、全員が使えるかで性格が変わる。全員なら「後半に置く」が定石になる。',
  scene: () => ({ hazards: BASE(), items: [{ t: 'respawn', x: 120, y: 160 }], uses: 1 }),
  onDeath(sc){ if (sc.uses > 0){ sc.uses--; sc.ghost = true; return true; } return false; },
  immune(sc, env){ return !!sc.ghost; },
  tick(sc, env){ if (sc.ghost && env.have && Math.hypot(env.cur.x - sc.items[0].x, env.cur.y - sc.items[0].y) < T.PAD_R * 0.8) sc.ghost = false; },
  draw(sc, env, L){ if (L !== 'under') return; const p = sc.items[0]; ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, T.PAD_R, 0, TAU); ctx.fillStyle = C.help; ctx.globalAlpha = sc.ghost ? 0.3 : 0.1; ctx.fill(); ctx.globalAlpha = sc.uses > 0 ? 1 : 0.3; ctx.strokeStyle = C.help; ctx.lineWidth = 3; ctx.stroke(); text(sc.uses > 0 ? 'RESPAWN' : 'USED', p.x, p.y, 12, C.help, 'center'); if (sc.ghost){ const pulse = 0.5 + 0.5 * Math.sin(sc.t * 8); ctx.globalAlpha = 0.5 + 0.5 * pulse; ctx.beginPath(); ctx.arc(p.x, p.y, T.PAD_R + 6 + pulse * 10, 0, TAU); ctx.stroke(); } ctx.restore(); } },
{ code: 'IT-8', name: 'シールド', kind: '拾う', det: true, desc: 'コース上に置かれた盾を拾うと、次の1回の被弾を無効化する。', how: '盾のアイコンに触れて拾う → 障害物に当たっても1回だけ耐える。', multi: 'マルチ: 早い者勝ちの拾い物。先行者有利を助長するので、置く位置はコース後半向き。',
  scene: () => ({ hazards: BASE(), items: [{ t: 'shield', x: 200, y: 360, taken: false }], shield: false }),
  tick(sc, env){ for (const s of sc.items) if (!s.taken && env.have && Math.hypot(env.cur.x - s.x, env.cur.y - s.y) < 26){ s.taken = true; sc.shield = true; } },
  onHit(sc){ if (sc.shield){ sc.shield = false; return true; } return false; },
  draw(sc, env, L){ if (L === 'under'){ for (const s of sc.items) if (!s.taken){ ctx.save(); ctx.translate(s.x, s.y); ctx.fillStyle = C.help2; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(18, -10); ctx.lineTo(14, 12); ctx.lineTo(0, 22); ctx.lineTo(-14, 12); ctx.lineTo(-18, -10); ctx.closePath(); ctx.fill(); ctx.restore(); } }
    if (L === 'over' && sc.shield && env.have){ ctx.save(); ctx.strokeStyle = C.help2; ctx.lineWidth = 3; ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(env.cur.x, env.cur.y, 16 + Math.sin(sc.t * 6) * 2, 0, TAU); ctx.stroke(); ctx.restore(); } } },
{ code: 'IT-9', name: '安全ロープ', kind: '描く', det: true, desc: '線を1本引く。線の上（幅16px）にいる間は無敵。細いので精密操作が必要。', how: 'ドラッグで線を引く（1本）→ 線に沿ってなぞるとハザードを無視できる。', multi: 'マルチ: ゴールまで真っすぐ引けると強すぎるので、長さ上限（例 400px）を付ける。',
  scene: () => ({ hazards: BASE(), items: [], uses: 1, maxLen: 400 }),
  onDragEnd(sc, a, b){ if (sc.uses <= 0) return; const L = Math.hypot(b.x - a.x, b.y - a.y); if (L < 20) return; const k = Math.min(1, sc.maxLen / L); sc.items.push({ t: 'rope', ax: a.x, ay: a.y, bx: a.x + (b.x - a.x) * k, by: a.y + (b.y - a.y) * k }); sc.uses--; },
  onRope(sc, env){ return env.have && sc.items.some(r => segPointDist(r.ax, r.ay, r.bx, r.by, env.cur.x, env.cur.y) <= 8); },
  immune(sc, env){ return this.onRope(sc, env); },
  draw(sc, env, L){ if (L !== 'under') return; const on = this.onRope(sc, env); for (const r of sc.items){ ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = C.help; ctx.globalAlpha = 0.25; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(r.ax, r.ay); ctx.lineTo(r.bx, r.by); ctx.stroke(); ctx.globalAlpha = on ? 1 : 0.7; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
    if (sc.drag && env.have){ const L2 = Math.hypot(env.cur.x - sc.drag.x, env.cur.y - sc.drag.y), k = Math.min(1, sc.maxLen / Math.max(1, L2)); ctx.save(); ctx.strokeStyle = C.help; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sc.drag.x, sc.drag.y); ctx.lineTo(sc.drag.x + (env.cur.x - sc.drag.x) * k, sc.drag.y + (env.cur.y - sc.drag.y) * k); ctx.stroke(); ctx.restore(); } } },
{ code: 'IT-10', name: 'ジャマー', kind: '設置', det: true, desc: '半径内にある発射系（弾幕・砲台・雨・回転レーザー）を停止させる。動く物体は止めない。', how: '円の中の砲台から弾が出ないのを見る。外の砲台は撃ち続ける。', multi: 'マルチ: 弾幕への対抗手段。回転バーなどの物理系には効かないので、万能にならない。',
  scene: () => ({ hazards: [...BULLETS(), { t: 'shooter', x: 1080, y: 740, dx: 0, dy: -1, speed: 380, interval: 0.8, r: 10, range: 760 }, { t: 'orbit', x: 640, y: 560, R: 70, r: 14, rpm: 40 }], items: [{ t: 'jam', x: 640, y: 360, r: 170 }] }),
  filterPieces(sc, hz){ return hz.filter(h => !(EMITTERS.has(h.t) && sc.items.some(j => Math.hypot(h.x - j.x, h.y - j.y) < j.r))); },
  draw(sc, env, L){ if (L === 'under'){ for (const j of sc.items){ ctx.save(); ctx.fillStyle = C.help2; ctx.globalAlpha = 0.08; ctx.beginPath(); ctx.arc(j.x, j.y, j.r, 0, TAU); ctx.fill(); ctx.globalAlpha = 0.7; ctx.strokeStyle = C.help2; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); ctx.stroke(); ctx.restore(); text('JAM', j.x, j.y + j.r - 16, 13, C.help2, 'center'); } }
    if (L === 'over'){ const all = sc.hazards, kept = this.filterPieces(sc, all); for (const h of all) if (!kept.includes(h)){ ctx.save(); ctx.strokeStyle = C.help2; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(h.x, h.y, 18, 0, TAU); ctx.moveTo(h.x - 12, h.y - 12); ctx.lineTo(h.x + 12, h.y + 12); ctx.stroke(); ctx.restore(); } } } },
];
const z0 = sc => sc.items[0];

// ===== 描画ヘルパー =====
const C = { haz: '#ff3b5c', bullet: '#ff5c7a', laser: '#ff4fd8', help: '#49e07c', help2: '#4fd3ff', emit: '#ffb84d', player: '#5ee1ff', dim: '#7d8aa3', fg: '#e6ecf5' };
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d'), stage = document.getElementById('stage');
function text(str, x, y, size, color, align){ ctx.fillStyle = color; ctx.font = `700 ${size}px ui-monospace,Consolas,monospace`; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y); }
function zone(p, color, label){ ctx.save(); ctx.fillStyle = color; ctx.globalAlpha = 0.08; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.globalAlpha = 0.6; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); ctx.strokeRect(p.x, p.y, p.w, p.h); ctx.globalAlpha = 1; ctx.setLineDash([]); text(label, p.x + 10, p.y + 14, 13, color); ctx.restore(); }

// ===== UI =====
const $ = id => document.getElementById(id);
let sel = 0, item = ITEMS[0], sc = null;
function buildList(){ const list = $('list'); list.innerHTML = '<h2>お助けアイテム</h2>'; ITEMS.forEach((o, i) => { const d = document.createElement('div'); d.className = 'it' + (i === sel ? ' sel' : ''); d.dataset.i = i; d.innerHTML = `<span class="code">${o.code}</span><span>${o.name}</span><span class="kind">${o.kind}</span>`; d.addEventListener('click', () => select(i)); list.appendChild(d); }); }
function select(i){ sel = i; item = ITEMS[i]; resetScene(); $('pName').textContent = item.name; $('pCode').textContent = item.code + ' · ' + item.kind; $('pBadges').innerHTML = `<span class="badge">${item.kind}</span><span class="badge">同期OK</span>`; $('pDesc').textContent = item.desc; $('pHow').textContent = item.how; $('pMulti').textContent = item.multi; document.querySelectorAll('#list .it').forEach(d => d.classList.toggle('sel', +d.dataset.i === i)); }
function resetScene(){ sc = item.scene(); sc.fx = []; sc.t = 0; sc.drag = null; sc.ghost = false; t0 = performance.now(); surviveStart = t0; deaths = 0; saved = 0; trail = []; particles = []; }
$('reset').addEventListener('click', resetScene);
addEventListener('keydown', e => { if (e.key === 'ArrowDown'){ e.preventDefault(); select((sel + 1) % ITEMS.length); } if (e.key === 'ArrowUp'){ e.preventDefault(); select((sel - 1 + ITEMS.length) % ITEMS.length); } });

// ===== ループ =====
let view = { s: 1, ox: 0, oy: 0, dpr: 1 };
function resize(){ const dpr = Math.min(2, devicePixelRatio || 1), w = stage.clientWidth, h = stage.clientHeight; cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr); const s = Math.min(w / T.W, h / T.H); view = { s, ox: (w - T.W * s) / 2, oy: (h - T.H * s) / 2, dpr }; }
addEventListener('resize', resize); resize();
const toL = e => { const b = cvs.getBoundingClientRect(); return { x: (e.clientX - b.left - view.ox) / view.s, y: (e.clientY - b.top - view.oy) / view.s }; };
let cur = { x: -999, y: -999 }, have = false, samples = [], clicks = [], ups = [], trail = [], particles = [];
let deaths = 0, saved = 0, invulnUntil = 0, t0 = performance.now(), surviveStart = t0, flash = 0;
cvs.addEventListener('pointermove', e => { for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) samples.push(toL(ev)); });
cvs.addEventListener('pointerdown', e => { const p = toL(e); samples.push(p); clicks.push(p); });
cvs.addEventListener('pointerup', e => ups.push(toL(e)));
cvs.addEventListener('pointerleave', () => { have = false; });
addEventListener('contextmenu', e => e.preventDefault());
function die(now){
  if (item.onHit && item.onHit(sc)){ saved++; invulnUntil = now + 500; flash = 0.5; return; }
  if (item.onDeath && item.onDeath(sc)){ deaths++; flash = 1; trail = []; return; }
  deaths++; invulnUntil = now + T.INVULN * 1000; flash = 1; surviveStart = now;
  for (let i = 0; i < 36; i++){ const a = Math.random() * TAU, v = 120 + Math.random() * 400; particles.push({ x: cur.x, y: cur.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.5, c: i % 3 ? C.haz : '#fff' }); }
  trail = [];
}
let lastNow = performance.now();
function update(now){
  const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
  const t = (now - t0) / 1000; sc.t = t;
  const env = { t, cur, have };
  for (const c of clicks){ if (item.onDragEnd) sc.drag = c; else if (item.onClick) item.onClick(sc, c); }
  for (const u of ups){ if (sc.drag && item.onDragEnd){ item.onDragEnd(sc, sc.drag, u); } sc.drag = null; }
  clicks.length = 0; ups.length = 0;
  const hz = item.filterPieces ? item.filterPieces(sc, sc.hazards) : sc.hazards;
  let ps = []; for (const h of hz) hazPrims(h, item.timeFor ? item.timeFor(sc, h, t) : t, ps);
  if (item.filterPrims) ps = item.filterPrims(sc, ps);
  const immune = item.immune ? item.immune(sc, env) : false, alive = now >= invulnUntil && !immune;
  for (const s of samples){
    if (alive && have){ const h = sweepHit(ps, cur.x, cur.y, s.x, s.y); if (h){ cur = s; die(now); have = true; continue; } }
    cur = s; have = true;
    const last = trail[trail.length - 1]; if (!last || Math.hypot(last.x - cur.x, last.y - cur.y) >= T.TRAIL_GAP) trail.push({ x: cur.x, y: cur.y, t: now });
  }
  samples.length = 0;
  env.cur = cur; env.have = have;
  if (item.tick) item.tick(sc, env);
  const immune2 = item.immune ? item.immune(sc, env) : false;
  if (now >= invulnUntil && !immune2 && have && sweepHit(ps, cur.x, cur.y, cur.x, cur.y)) die(now);
  while (trail.length && trail[0].t < now - T.TRAIL_LIFE * 1000) trail.shift();
  for (const p of particles){ p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; } particles = particles.filter(p => p.life > 0);
  flash = Math.max(0, flash - dt * 3);
  $('hTime').textContent = ((now - surviveStart) / 1000).toFixed(1); $('hDeaths').textContent = deaths; $('hSaved').textContent = saved;
  $('hState').textContent = (sc.uses !== undefined ? `残り使用 ${sc.uses}` : '') + (sc.ghost ? ' · 幽霊：復活パッドへ' : '') + (sc.shield ? ' · シールド有効' : '') + (immune2 ? ' · 無敵中' : '');
  draw(now, t, hz, ps, env, now >= invulnUntil, immune2);
}
function draw(now, t, hz, ps, env, alive, immune){
  const { s, ox, oy, dpr } = view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#07090f'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, ox * dpr, oy * dpr);
  ctx.fillStyle = '#0d1220'; ctx.fillRect(0, 0, T.W, T.H);
  ctx.strokeStyle = '#141b2d'; ctx.lineWidth = 1; ctx.beginPath(); for (let x = 80; x < T.W; x += 80){ ctx.moveTo(x, 0); ctx.lineTo(x, T.H); } for (let y = 80; y < T.H; y += 80){ ctx.moveTo(0, y); ctx.lineTo(T.W, y); } ctx.stroke();
  if (flash > 0){ ctx.fillStyle = C.haz; ctx.globalAlpha = flash * 0.25; ctx.fillRect(0, 0, T.W, T.H); ctx.globalAlpha = 1; }
  if (item.draw) item.draw(sc, env, 'under');
  // 砲台の台座
  for (const h of sc.hazards) if (EMITTERS.has(h.t) && h.t !== 'rain'){ ctx.beginPath(); ctx.arc(h.x, h.y, 14, 0, TAU); ctx.fillStyle = '#1a1f2c'; ctx.fill(); ctx.strokeStyle = C.emit; ctx.lineWidth = 3; ctx.stroke(); }
  for (const pr of ps){
    if (pr.k === 'rect'){ if (pr.c === 'wall'){ ctx.fillStyle = '#2b3650'; ctx.fillRect(pr.x, pr.y, pr.w, pr.h); ctx.strokeStyle = '#5a6d94'; ctx.lineWidth = 2; ctx.strokeRect(pr.x + 1, pr.y + 1, pr.w - 2, pr.h - 2); } else { ctx.save(); ctx.shadowColor = C.haz; ctx.shadowBlur = 14; ctx.fillStyle = C.haz; ctx.fillRect(pr.x, pr.y, pr.w, pr.h); ctx.restore(); } }
    else if (pr.k === 'circ'){ const col = pr.c === 'bullet' ? C.bullet : C.haz; ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, TAU); ctx.fillStyle = col; ctx.fill(); ctx.restore(); }
    else if (pr.k === 'cap'){ ctx.save(); ctx.lineCap = 'round'; ctx.shadowColor = pr.c === 'laser' ? C.laser : C.haz; ctx.shadowBlur = 14; ctx.strokeStyle = pr.c === 'laser' ? C.laser : C.haz; ctx.lineWidth = pr.r * 2; ctx.beginPath(); ctx.moveTo(pr.ax, pr.ay); ctx.lineTo(pr.bx, pr.by); ctx.stroke(); ctx.restore(); if (pr.src.t === 'bar'){ ctx.beginPath(); ctx.arc(pr.src.x, pr.src.y, pr.r + 4, 0, TAU); ctx.fillStyle = '#1a1f2c'; ctx.fill(); ctx.strokeStyle = C.haz; ctx.lineWidth = 2; ctx.stroke(); } }
  }
  if (item.draw) item.draw(sc, env, 'over');
  for (const p of particles){ ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); } ctx.globalAlpha = 1;
  const col = immune ? C.help : C.player;
  ctx.fillStyle = col; for (const d of trail){ const f = 1 - (now - d.t) / (T.TRAIL_LIFE * 1000); if (f <= 0) continue; ctx.globalAlpha = 0.9 * f; ctx.beginPath(); ctx.arc(d.x, d.y, 5 * (0.3 + 0.7 * f), 0, TAU); ctx.fill(); } ctx.globalAlpha = 1;
  if (have){ ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = alive ? 18 : 0; ctx.beginPath(); ctx.arc(cur.x, cur.y, 8, 0, TAU); if (alive && !sc.ghost){ ctx.fillStyle = col; ctx.fill(); ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(cur.x, cur.y, 3.5, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); } else { ctx.strokeStyle = '#8d97ad'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.stroke(); } ctx.restore(); }
  text(item.code + ' ' + item.name, T.W / 2, 24, 18, C.fg, 'center');
}
buildList(); select(0);
function loop(now){ try { update(now); } catch (e) { console.error(e); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
