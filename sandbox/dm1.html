<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DM-1 Danmaku Sandbox</title>
<style>
/* Layout: 16:9 arena letterboxed left, control panel docked right. Single dark arcade theme by choice. */
:root{
  --bg:#07090f; --arena:#0d1220; --grid:#141b2d; --fg:#e6ecf5; --dim:#7d8aa3;
  --wall:#2b3650; --wall-edge:#5a6d94; --bullet:#ff5c7a; --bullet-core:#ffe3e9; --emit:#ffb84d; --player:#5ee1ff; --panel:#0f1526; --line:#243052;
  --font:ui-monospace,Consolas,"Chakra Petch",monospace; color-scheme:dark;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#wrap{display:flex;height:100%}
#stage{flex:1;min-width:0;position:relative}
#c{display:block;width:100%;height:100%;cursor:none;touch-action:none;user-select:none}
#hud{position:absolute;left:14px;top:10px;pointer-events:none;font-size:14px;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;line-height:1.5}
#hud .big{font-size:28px;line-height:1.1}
#hud .dim{color:var(--dim);font-weight:500}
#panel{width:270px;flex:none;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px;box-sizing:border-box;overflow-y:auto;font-size:13px;cursor:auto}
#panel h1{font-size:15px;margin:0 0 4px;letter-spacing:.1em}
#panel p{margin:0 0 12px;color:var(--dim);line-height:1.5}
#panel label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0;align-items:center}
#panel label span.v{color:var(--dim);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
#panel input[type=range]{grid-column:1/3;width:100%;accent-color:var(--bullet)}
#panel select,#panel button{width:100%;background:#182038;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;margin:4px 0}
#panel button{cursor:pointer}
#panel button:hover{border-color:var(--player)}
#panel .row{display:flex;gap:8px}
#panel .row button{flex:1}
#panel .chk{display:flex;gap:8px;align-items:center;margin:10px 0}
#panel hr{border:0;border-top:1px solid var(--line);margin:12px 0}
@media (max-width:760px){ #wrap{flex-direction:column} #panel{width:auto;max-height:45%;border-left:0;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="big" id="hTime">0.0</div>
      <div class="dim">生存秒 · ベスト <span id="hBest">0.0</span></div>
      <div class="dim">死亡 <span id="hDeaths">0</span> · 弾 <span id="hBullets">0</span> · <span id="hFps">60</span>fps</div>
    </div>
  </div>
  <div id="panel">
    <h1>DM-1 弾幕</h1>
    <p>弾は壁を貫通し、カーソルに当たると死。死んだら1秒無敵でその場復帰。本編と同じ「時間の純関数」で動くのでマルチでも同期不要。</p>
    <label>プリセット<select id="preset"></select></label>
    <label>パターン<select id="pattern"><option value="ring">リング（全方向）</option><option value="fan">扇（掃射）</option></select></label>
    <label>弾数/発 <span class="v" id="vn"></span><input type="range" id="n" min="1" max="48" step="1"></label>
    <label>弾速 px/s <span class="v" id="vspeed"></span><input type="range" id="speed" min="40" max="600" step="10"></label>
    <label>発射間隔 s <span class="v" id="vinterval"></span><input type="range" id="interval" min="0.03" max="2" step="0.01"></label>
    <label>弾の半径 <span class="v" id="vr"></span><input type="range" id="r" min="2" max="16" step="1"></label>
    <label>毎発の回転 ° <span class="v" id="vspin"></span><input type="range" id="spin" min="-30" max="30" step="0.5"></label>
    <label>扇の広がり ° <span class="v" id="vspread"></span><input type="range" id="spread" min="5" max="180" step="5"></label>
    <label>多層（速度違い） <span class="v" id="vlayers"></span><input type="range" id="layers" min="1" max="5" step="1"></label>
    <label>弾の寿命 s <span class="v" id="vlife"></span><input type="range" id="life" min="0.5" max="8" step="0.5"></label>
    <div class="chk"><input type="checkbox" id="walls" checked><label for="walls" style="display:inline">壁を表示（貫通の確認用）</label></div>
    <div class="chk"><input type="checkbox" id="multi"><label for="multi" style="display:inline">砲台を3つに増やす</label></div>
    <hr>
    <div class="row"><button id="reset">タイマーリセット</button><button id="copy">ピースJSONをコピー</button></div>
    <p id="json" style="word-break:break-all;font-size:11px"></p>
  </div>
</div>
<script>
'use strict';
const T = { W: 1280, H: 720, HEAD_R: 4, TRAIL_LIFE: 0.6, TRAIL_GAP: 5, INVULN: 1.0 };
const TAU = Math.PI * 2, DEG = Math.PI / 180;

// ===== danmaku ピース（本編 prims() にそのまま足せる形） =====
// { t:'danmaku', x,y, pattern:'ring'|'fan', n, speed, interval, r, spin(°/発), spread(°), aim(°), layers, life(s), phase }
function danmakuPrims(p, t, out){
  const kmax = Math.floor((t - (p.phase || 0) * p.interval) / p.interval), kmin = Math.max(0, Math.ceil((t - p.life - (p.phase || 0) * p.interval) / p.interval));
  const layers = p.layers || 1;
  for (let k = kmin; k <= kmax; k++){
    const age = t - (k + (p.phase || 0)) * p.interval; if (age < 0 || age > p.life) continue;
    const base = (p.aim || 0) + k * (p.spin || 0);
    for (let i = 0; i < p.n; i++){
      const ang = p.pattern === 'fan' ? base + (p.n > 1 ? -p.spread / 2 + i * p.spread / (p.n - 1) : 0) : base + i * 360 / p.n;
      const cx = Math.cos(ang * DEG), sy = Math.sin(ang * DEG);
      for (let L = 0; L < layers; L++){
        const d = age * p.speed * (1 - L * 0.22), x = p.x + cx * d, y = p.y + sy * d;
        if (x < -p.r || y < -p.r || x > T.W + p.r || y > T.H + p.r) continue;
        out.push({ k: 'circ', x, y, r: p.r, c: 'bullet', src: p });
      }
    }
  }
}
function prims(pieces, t){
  const out = [];
  for (const p of pieces){
    if (p.t === 'wall') out.push({ k: 'rect', x: p.x, y: p.y, w: p.w, h: p.h, c: 'wall', src: p });
    else if (p.t === 'danmaku') danmakuPrims(p, t, out);
  }
  return out;
}
// ===== 幾何（本編と同じ） =====
function segPointDist(ax, ay, bx, by, px, py){
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let u = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; u = u < 0 ? 0 : u > 1 ? 1 : u;
  return Math.hypot(ax + dx * u - px, ay + dy * u - py);
}
function segRect(x0, y0, x1, y1, xmin, ymin, xmax, ymax){
  let t0 = 0, t1 = 1; const dx = x1 - x0, dy = y1 - y0, p = [-dx, dx, -dy, dy], q = [x0 - xmin, xmax - x0, y0 - ymin, ymax - y0];
  for (let i = 0; i < 4; i++){ if (p[i] === 0){ if (q[i] < 0) return false; } else { const r = q[i] / p[i]; if (p[i] < 0){ if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; } } }
  return true;
}
function hit(pr, ax, ay, bx, by, r){
  if (pr.k === 'rect') return segRect(ax, ay, bx, by, pr.x - r, pr.y - r, pr.x + pr.w + r, pr.y + pr.h + r);
  if (pr.k === 'circ') return segPointDist(ax, ay, bx, by, pr.x, pr.y) <= pr.r + r;
  return false;
}
function sweepHit(ps, ax, ay, bx, by){ for (const pr of ps) if (hit(pr, ax, ay, bx, by, T.HEAD_R)) return pr; return null; }

// ===== プリセット =====
const PRESETS = {
  'リング': { pattern: 'ring', n: 24, speed: 160, interval: 0.7, r: 6, spin: 7, spread: 60, layers: 1, life: 5 },
  '扇の掃射': { pattern: 'fan', n: 7, speed: 260, interval: 0.25, r: 6, spin: 9, spread: 60, layers: 1, life: 4 },
  '渦巻き': { pattern: 'ring', n: 3, speed: 180, interval: 0.06, r: 5, spin: 11, spread: 60, layers: 1, life: 5 },
  '多層リング': { pattern: 'ring', n: 16, speed: 220, interval: 1.0, r: 6, spin: 11.25, spread: 60, layers: 3, life: 4 },
  '密な壁弾': { pattern: 'fan', n: 18, speed: 120, interval: 0.9, r: 5, spin: 23, spread: 170, layers: 2, life: 7 },
};
const P = { t: 'danmaku', x: 640, y: 360, aim: 0, phase: 0, ...PRESETS['リング'] };
const WALLS = [
  { t: 'wall', x: 300, y: 200, w: 40, h: 320 }, { t: 'wall', x: 940, y: 200, w: 40, h: 320 },
  { t: 'wall', x: 560, y: 90, w: 160, h: 36 }, { t: 'wall', x: 560, y: 594, w: 160, h: 36 },
];
function pieces(){
  const out = [];
  if (ui.walls.checked) out.push(...WALLS);
  out.push(P);
  if (ui.multi.checked){ out.push({ ...P, x: 200, y: 140, phase: 0.33 }, { ...P, x: 1080, y: 580, phase: 0.66, spin: -(P.spin || 0) }); }
  return out;
}

// ===== UI =====
const $ = id => document.getElementById(id);
const ui = { preset: $('preset'), pattern: $('pattern'), walls: $('walls'), multi: $('multi'), json: $('json') };
const KEYS = ['n', 'speed', 'interval', 'r', 'spin', 'spread', 'layers', 'life'];
for (const name in PRESETS){ const o = document.createElement('option'); o.value = name; o.textContent = name; ui.preset.appendChild(o); }
function applyPreset(name){ Object.assign(P, PRESETS[name]); syncUI(); }
function syncUI(){ ui.pattern.value = P.pattern; for (const k of KEYS){ $(k).value = P[k]; $('v' + k).textContent = P[k]; } showJson(); }
function showJson(){ ui.json.textContent = JSON.stringify(P); }
ui.preset.addEventListener('change', () => applyPreset(ui.preset.value));
ui.pattern.addEventListener('change', () => { P.pattern = ui.pattern.value; showJson(); });
for (const k of KEYS) $(k).addEventListener('input', () => { P[k] = +$(k).value; $('v' + k).textContent = P[k]; showJson(); });
$('reset').addEventListener('click', () => { surviveStart = performance.now(); });
$('copy').addEventListener('click', () => { navigator.clipboard.writeText(JSON.stringify(P)).catch(() => {}); });
syncUI();

// ===== ループ =====
const cvs = $('c'), ctx = cvs.getContext('2d'), stage = $('stage');
let view = { s: 1, ox: 0, oy: 0, dpr: 1 };
function resize(){ const dpr = Math.min(2, devicePixelRatio || 1), w = stage.clientWidth, h = stage.clientHeight; cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr); const s = Math.min(w / T.W, h / T.H); view = { s, ox: (w - T.W * s) / 2, oy: (h - T.H * s) / 2, dpr }; }
addEventListener('resize', resize); resize();
const toL = e => { const b = cvs.getBoundingClientRect(); return { x: (e.clientX - b.left - view.ox) / view.s, y: (e.clientY - b.top - view.oy) / view.s }; };
let cur = { x: -999, y: -999 }, have = false, samples = [], trail = [], particles = [];
let deaths = 0, invulnUntil = 0, surviveStart = performance.now(), bestSurvive = 0, flash = 0, fpsT = 0, fpsN = 0;
cvs.addEventListener('pointermove', e => { for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) samples.push(toL(ev)); });
cvs.addEventListener('pointerdown', e => samples.push(toL(e)));
cvs.addEventListener('pointerleave', () => { have = false; });
addEventListener('contextmenu', e => e.preventDefault());

function die(now){
  deaths++; invulnUntil = now + T.INVULN * 1000; flash = 1;
  bestSurvive = Math.max(bestSurvive, (now - surviveStart) / 1000); surviveStart = now;
  for (let i = 0; i < 36; i++){ const a = Math.random() * TAU, v = 120 + Math.random() * 400; particles.push({ x: cur.x, y: cur.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.5, c: i % 3 ? '#ff5c7a' : '#fff' }); }
  trail = [];
}
let lastNow = performance.now(), t0 = performance.now();
function update(now){
  const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
  const t = (now - t0) / 1000, pcs = pieces(), ps = prims(pcs, t), alive = now >= invulnUntil;
  for (const s of samples){
    if (alive && have){ const h = sweepHit(ps, cur.x, cur.y, s.x, s.y); if (h){ cur = s; die(now); have = true; continue; } }
    cur = s; have = true;
    const last = trail[trail.length - 1]; if (!last || Math.hypot(last.x - cur.x, last.y - cur.y) >= T.TRAIL_GAP) trail.push({ x: cur.x, y: cur.y, t: now });
  }
  samples.length = 0;
  if (alive && have && sweepHit(ps, cur.x, cur.y, cur.x, cur.y)) die(now);
  while (trail.length && trail[0].t < now - T.TRAIL_LIFE * 1000) trail.shift();
  for (const p of particles){ p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  flash = Math.max(0, flash - dt * 3);
  fpsN++; if (now - fpsT > 500){ $('hFps').textContent = Math.round(fpsN * 1000 / (now - fpsT)); fpsT = now; fpsN = 0; }
  $('hTime').textContent = ((now - surviveStart) / 1000).toFixed(1); $('hBest').textContent = bestSurvive.toFixed(1);
  $('hDeaths').textContent = deaths; $('hBullets').textContent = ps.filter(p => p.c === 'bullet').length;
  draw(now, pcs, ps, alive);
}
function draw(now, pcs, ps, alive){
  const { s, ox, oy, dpr } = view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#07090f'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, ox * dpr, oy * dpr);
  ctx.fillStyle = '#0d1220'; ctx.fillRect(0, 0, T.W, T.H);
  ctx.strokeStyle = '#141b2d'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 80; x < T.W; x += 80){ ctx.moveTo(x, 0); ctx.lineTo(x, T.H); } for (let y = 80; y < T.H; y += 80){ ctx.moveTo(0, y); ctx.lineTo(T.W, y); } ctx.stroke();
  if (flash > 0){ ctx.fillStyle = '#ff5c7a'; ctx.globalAlpha = flash * 0.25; ctx.fillRect(0, 0, T.W, T.H); ctx.globalAlpha = 1; }
  // 壁（弾より下に描く＝貫通して見える）
  for (const pr of ps) if (pr.k === 'rect'){ ctx.fillStyle = '#2b3650'; ctx.fillRect(pr.x, pr.y, pr.w, pr.h); ctx.strokeStyle = '#5a6d94'; ctx.lineWidth = 2; ctx.strokeRect(pr.x + 1, pr.y + 1, pr.w - 2, pr.h - 2); }
  // 砲台
  for (const p of pcs) if (p.t === 'danmaku'){
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(((p.aim || 0) + Math.floor(((now - t0) / 1000 - (p.phase || 0) * p.interval) / p.interval) * (p.spin || 0)) * DEG);
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fillStyle = '#1a1f2c'; ctx.fill(); ctx.strokeStyle = '#ffb84d'; ctx.lineWidth = 3; ctx.stroke();
    if (p.pattern === 'fan'){ ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(26, 0); ctx.strokeStyle = '#ffb84d'; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.restore();
  }
  // 弾
  ctx.save(); ctx.shadowColor = '#ff5c7a'; ctx.shadowBlur = 10;
  for (const pr of ps) if (pr.k === 'circ'){ ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, TAU); ctx.fillStyle = '#ff5c7a'; ctx.fill(); }
  ctx.shadowBlur = 0;
  for (const pr of ps) if (pr.k === 'circ' && pr.r >= 4){ ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r * 0.45, 0, TAU); ctx.fillStyle = '#ffe3e9'; ctx.fill(); }
  ctx.restore();
  for (const p of particles){ ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); } ctx.globalAlpha = 1;
  // 自機
  ctx.fillStyle = '#5ee1ff';
  for (const d of trail){ const f = 1 - (now - d.t) / (T.TRAIL_LIFE * 1000); if (f <= 0) continue; ctx.globalAlpha = 0.9 * f; ctx.beginPath(); ctx.arc(d.x, d.y, 5 * (0.3 + 0.7 * f), 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (have){
    ctx.save(); ctx.shadowColor = '#5ee1ff'; ctx.shadowBlur = alive ? 18 : 0; ctx.beginPath(); ctx.arc(cur.x, cur.y, 8, 0, TAU);
    if (alive){ ctx.fillStyle = '#5ee1ff'; ctx.fill(); ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(cur.x, cur.y, 3.5, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); }
    else { ctx.strokeStyle = '#8d97ad'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.stroke(); }
    ctx.restore();
  }
}
function loop(now){ try { update(now); } catch (e) { console.error(e); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
