<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cursor Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one fixed 16:9 arena letterboxed into the window; HUD floats over it. Single dark arcade theme by choice. */
:root{
  --bg:#07090f; --arena:#0d1220; --grid:#141b2d; --fg:#e6ecf5; --dim:#7d8aa3;
  --wall:#2b3650; --wall-edge:#5a6d94; --haz:#ff3b5c; --laser:#ff4fd8; --start:#49e07c; --cp:#4fd3ff; --exit:#ffd044;
  --player:#5ee1ff; --ghost:#8d97ad; --card:#121a2c; --card-hi:#1b2742;
  --font:"Chakra Petch",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#c{display:block;width:100%;height:100%;cursor:none;touch-action:none;user-select:none}
#hud{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));pointer-events:none;font-size:15px;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
#hud .big{font-size:30px;line-height:1}
#hud .dim{color:var(--dim);font-weight:500}
#msg{position:fixed;left:0;right:0;bottom:max(8vh,env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#msg h1{margin:0;font-size:clamp(28px,6vw,64px);letter-spacing:.12em;text-wrap:balance}
#msg p{margin:6px 0 0;color:var(--dim);font-size:clamp(13px,1.8vw,17px);font-weight:500}
#msg .res{display:inline-grid;grid-template-columns:auto auto;gap:2px 18px;margin-top:10px;font-size:15px;text-align:left;font-variant-numeric:tabular-nums}
#msg .medal{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:999px;font-weight:700;letter-spacing:.1em}
#msg .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#msg .acts button{pointer-events:auto;font:inherit;font-size:14px;font-weight:700;color:var(--fg);background:var(--card);border:2px solid var(--wall-edge);border-radius:6px;padding:7px 14px;cursor:pointer}
#msg .acts button:hover{border-color:var(--player);background:var(--card-hi)}
#msg .acts button.go{border-color:var(--start);color:var(--start)}
#msg .acts button:focus-visible{outline:2px solid var(--player);outline-offset:2px}
#keys{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));color:var(--dim);font-size:12px;font-weight:500;text-align:right;pointer-events:none;line-height:1.5}
[hidden]{display:none!important}
/* 名前入力と共有テキストの小窓。ここだけは普通のカーソルで操作する */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,9,15,.72);z-index:5;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#overlay .box{background:var(--card);border:2px solid var(--wall-edge);border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;width:min(440px,100%);box-sizing:border-box}
#overlay label{font-weight:700;letter-spacing:.06em}
#overlay input,#overlay textarea{font:inherit;font-size:18px;color:var(--fg);background:var(--bg);border:2px solid var(--wall-edge);border-radius:6px;padding:8px 10px;min-width:0}
#overlay textarea{font-size:14px;font-weight:500;height:132px;resize:none;line-height:1.5}
#overlay .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#overlay button{font:inherit;font-weight:700;color:var(--fg);background:var(--card-hi);border:2px solid var(--wall-edge);border-radius:6px;padding:8px 16px;cursor:pointer}
#overlay button.go{border-color:var(--start);color:var(--start)}
#overlay :focus-visible{outline:2px solid var(--player);outline-offset:2px}
#toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--card);border:2px solid var(--start);border-radius:999px;padding:6px 18px;font-weight:700;font-size:14px;pointer-events:none;z-index:6;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="big" id="hTime">0.00</div>
  <div><span id="hRoom"></span> <span class="dim" id="hName"></span></div>
  <div class="dim" id="hLine3">DEATHS <span id="hDeaths">0</span> · BEST <span id="hBest">--</span></div>
  <div class="dim" id="hDbg" hidden></div>
</div>
<div id="keys"></div>
<div id="msg"></div>
<div id="toast" hidden></div>
<div id="overlay" hidden>
  <form class="box" id="ovForm">
    <label for="ovName" id="ovLabel"></label>
    <input id="ovName" maxlength="12" autocomplete="off" spellcheck="false">
    <textarea id="ovText" readonly hidden></textarea>
    <div class="row"><button type="button" id="ovCancel">閉じる</button><button type="submit" class="go" id="ovOk">決定</button></div>
  </form>
</div>
<script>
'use strict';
// ===================== 調整値 =====================
const T = {
  W: 1280, H: 720,     // 部屋の論理サイズ
  HEAD_R: 4,           // 当たり判定半径（カーソル点）
  PAD_R: 46,           // スタート/CP/出口パッド半径
  TRAIL_LIFE: 0.7,     // 尻尾ドットが消えるまでの秒
  TRAIL_GAP: 5,        // ドットを落とす間隔(px)
  TRAIL_R: 5,          // ドット半径
  COUNTDOWN: 2.0,      // スタートパッド静止秒
  GHOST_HZ: 30,        // ゴースト記録レート
  POS_HZ: 20,          // マルチ: カーソル送信レート
  // 画面の振動（見た目だけ。当たり判定にもカーソルの位置にも一切使わない）
  SHAKE: {
    MAX: 12,                                              // 合計の揺れ幅の上限(px)
    DEFAULT: { beam: 7, rotlaser: 4, crusher: 5, mine: 9 }, // shake を書いていないピースの揺れ幅(px)。0 か未記載なら揺れない
    LENS_R0: 90, LENS_R1: 230, LENS_STEPS: 14,            // カーソルから R0 までは揺らさず、R1 にかけて段階的に揺れへつなぐ（段の数）
  },
};
const COURSE_VER = 'v0.2';

// ===================== ピース =====================
// wall    静止矩形                 x,y,w,h
// slider  矩形が往復               x,y,w,h,dx,dy,period,phase
// bar     線分が回転               x,y,len,thick,rpm,phase, blades(羽根数), anchor:'end'(端を軸に)
// pulser  円が脈動                 x,y,rmin,rmax,period,phase
// orbit   円が円軌道を周回         x,y,R,r,rpm,phase
// gate    レーザー線が点滅         ax,ay,bx,by,thick,period,duty,phase
// blink   壁が点滅                 x,y,w,h,period,duty,phase
// shooter 弾を一定間隔で発射       x,y,dx,dy(単位方向),speed,interval,r,range,phase
// --- 図鑑から採用（2026-11-06） ---
// aimed     狙い撃ち: 発射時刻は共通、狙いは各自のカーソル、1発ずつ  x,y,speed,interval,r,life
// rotlaser  回転レーザー: 予告→照射→休み                           x,y,len,rpm,thick,on,warn,off,phase
// rain      雨: 疑似乱数位置に落下（seed で全員同じ）               x,w,interval,speed,r,seed
// slidelaser 往復レーザー                                           x,y,len,dx,period,thick,phase
// crusher   押し潰し: 上下の顎が閉じて開く                           x,y,w,h,gap,travel,period,phase
// stretch   伸縮バー                                                x,y,lmin,lmax,period,rpm,thick,phase
// mine      地雷（各自判定）                                         x,y,trigger,fuse,blast,hold,cooldown
// warnfloor 予告付き床                                              x,y,w,h,period,duty,warn,phase
// chaser    追跡者（各自判定）                                       x,y,speed,r
// shadow    自分の影（各自判定）                                     x,y(目印),delay,r
// speedzone 速度制限区画（範囲指定）                                 x,y,w,h,limit
// nostop    停止禁止区画（範囲指定）                                 x,y,w,h,min,grace
// --- 2026-11-23 ---
// beam      横断レーザー: (x,y) を通り画面を端から端まで貫く。予告→照射→休み   x,y,deg,thick,warn,on,off,phase
// どのピースにも shake（揺れ幅px）を書ける。「撃っている間」「叩きつけた瞬間」など型ごとの山で画面が揺れる（shakeEnv）。
const TAU = Math.PI * 2;
function osc(t, period, phase){ return (1 - Math.cos(TAU * (t / period + (phase || 0)))) / 2; }
function frac(v){ return (v % 1 + 1) % 1; }
const hash = k => frac(Math.sin(k * 12.9898 + 78.233) * 43758.5453);
// 状態を持つピースの状態置き場。マルチではピースが同期ごとに差し替わるので id で持つ
const PSTATE = new Map();
const stateOf = p => { const k = p.id || p; let s = PSTATE.get(k); if (!s){ s = {}; PSTATE.set(k, s); } return s; };
function resetPieceState(){ PSTATE.clear(); }
function rotlaserState(p, t){ const cyc = p.on + p.warn + p.off, ph = frac(t / cyc + (p.phase || 0)) * cyc, a = t * p.rpm * TAU / 60 + (p.phase || 0) * TAU; return { a, warn: ph < p.warn, on: ph >= p.warn && ph < p.warn + p.on }; }
function beamState(p, t){ const cyc = p.on + p.warn + p.off, ph = frac(t / cyc + (p.phase || 0)) * cyc, a = (p.deg || 0) * Math.PI / 180; return { dx: Math.cos(a), dy: Math.sin(a), warn: ph < p.warn, on: ph >= p.warn && ph < p.warn + p.on }; }
function historyAt(env, delay){ const h = env.history, tt = env.t - delay; if (!h.length || h[0].t > tt) return null; let i = h.length - 1; while (i > 0 && h[i].t > tt) i--; return h[i]; }
// 状態更新。env = { t, dt, cur, prev, have, speed, history }
function stepPieces(pieces, env){
  for (const p of pieces){
    if (p.t === 'aimed'){ const s = stateOf(p); if (s.b === undefined || env.t < s.last){ s.b = []; s.next = p.interval; } s.last = env.t;
      if (env.t >= s.next){ s.next = (Math.floor(env.t / p.interval) + 1) * p.interval; if (env.have && env.t > 0.01){ const a = Math.atan2(env.cur.y - p.y, env.cur.x - p.x); s.b.push({ x: p.x, y: p.y, vx: Math.cos(a) * p.speed, vy: Math.sin(a) * p.speed, t0: env.t }); } }
      for (const b of s.b){ b.x += b.vx * env.dt; b.y += b.vy * env.dt; } s.b = s.b.filter(b => env.t - b.t0 < p.life && b.x > -20 && b.y > -20 && b.x < T.W + 20 && b.y < T.H + 20); }
    else if (p.t === 'mine'){ const s = stateOf(p); if (!s.ph) s.ph = 'idle'; const d = env.have ? Math.hypot(env.cur.x - p.x, env.cur.y - p.y) : 1e9;
      if (s.ph === 'idle' && d < p.trigger && env.t > 0){ s.ph = 'armed'; s.t0 = env.t; } else if (s.ph === 'armed' && env.t - s.t0 >= p.fuse){ s.ph = 'blast'; s.t0 = env.t; } else if (s.ph === 'blast' && env.t - s.t0 >= p.hold){ s.ph = 'cool'; s.t0 = env.t; } else if (s.ph === 'cool' && env.t - s.t0 >= p.cooldown) s.ph = 'idle'; }
    else if (p.t === 'chaser'){ const s = stateOf(p); if (s.x === undefined){ s.x = p.x; s.y = p.y; } if (!env.have || env.t <= 0) continue; const dx = env.cur.x - s.x, dy = env.cur.y - s.y, d = Math.hypot(dx, dy); if (d > 1){ const m = Math.min(d, p.speed * env.dt); s.x += dx / d * m; s.y += dy / d * m; } }
    else if (p.t === 'nostop'){ const s = stateOf(p); s.acc = (env.have && env.t > 0 && inRect(env.cur, p) && env.speed < p.min) ? (s.acc || 0) + env.dt : 0; }
  }
}
// 区画ルールによる死亡。該当ピースを返す
function ruleHit(pieces, env){
  if (!env.have) return null;
  for (const p of pieces){
    if (p.t === 'speedzone' && inRect(env.cur, p) && env.speed > p.limit) return p;
    if (p.t === 'nostop' && (stateOf(p).acc || 0) > p.grace) return p;
  }
  return null;
}
function prims(room, t, env){
  const out = [];
  for (const p of room.pieces){
    switch (p.t){
      case 'aimed': { const s = stateOf(p); for (const b of (s.b || [])) out.push({ k: 'circ', x: b.x, y: b.y, r: p.r, c: 'haz', src: p }); break; }
      case 'rotlaser': { const st = rotlaserState(p, t); if (st.on) out.push({ k: 'cap', ax: p.x, ay: p.y, bx: p.x + Math.cos(st.a) * p.len, by: p.y + Math.sin(st.a) * p.len, r: p.thick / 2, c: 'laser', src: p }); break; }
      case 'beam': { const st = beamState(p, t); if (st.on) out.push({ k: 'cap', ax: p.x - st.dx * 1700, ay: p.y - st.dy * 1700, bx: p.x + st.dx * 1700, by: p.y + st.dy * 1700, r: p.thick / 2, c: 'laser', src: p }); break; }
      case 'rain': { const life = (T.H + 2 * p.r) / p.speed, kmax = Math.floor(t / p.interval), kmin = Math.max(0, Math.ceil((t - life) / p.interval));
        for (let k = kmin; k <= kmax; k++){ const age = t - k * p.interval; if (age < 0) continue; const y = -p.r + p.speed * age; if (y > T.H + p.r) continue; out.push({ k: 'circ', x: p.x + hash(k * 7 + (p.seed || 1) * 131) * p.w, y, r: p.r, c: 'haz', src: p }); } break; }
      case 'slidelaser': { const cx = p.x - p.dx / 2 + p.dx * osc(t, p.period, p.phase); out.push({ k: 'cap', ax: cx, ay: p.y - p.len / 2, bx: cx, by: p.y + p.len / 2, r: p.thick / 2, c: 'laser', src: p }); break; }
      case 'crusher': { const jaw = Math.max(0, p.h / 2 - p.gap / 2 - p.travel * (1 - osc(t, p.period, p.phase)));
        out.push({ k: 'rect', x: p.x, y: p.y - p.h / 2, w: p.w, h: jaw, c: 'haz', src: p }, { k: 'rect', x: p.x, y: p.y + p.h / 2 - jaw, w: p.w, h: jaw, c: 'haz', src: p }); break; }
      case 'stretch': { const len = p.lmin + (p.lmax - p.lmin) * osc(t, p.period, p.phase), a = (p.phase || 0) * TAU + t * p.rpm * TAU / 60, cx = Math.cos(a) * len / 2, sy = Math.sin(a) * len / 2;
        out.push({ k: 'cap', ax: p.x - cx, ay: p.y - sy, bx: p.x + cx, by: p.y + sy, r: p.thick / 2, c: 'haz', src: p }); break; }
      case 'mine': { if (stateOf(p).ph === 'blast') out.push({ k: 'circ', x: p.x, y: p.y, r: p.blast, c: 'haz', src: p }); break; }
      case 'warnfloor': out.push({ k: 'rect', x: p.x, y: p.y, w: p.w, h: p.h, c: 'warn', on: frac(t / p.period + (p.phase || 0)) < p.duty, src: p }); break;
      case 'chaser': { const s = stateOf(p); out.push({ k: 'circ', x: s.x === undefined ? p.x : s.x, y: s.y === undefined ? p.y : s.y, r: p.r, c: 'haz', src: p }); break; }
      case 'shadow': { if (env && env.history){ const q = historyAt(env, p.delay); if (q) out.push({ k: 'circ', x: q.x, y: q.y, r: p.r, c: 'haz', src: p }); } break; }
      case 'speedzone': case 'nostop': break; // ruleHit で判定
      case 'wall': out.push({ k: 'rect', x: p.x, y: p.y, w: p.w, h: p.h, c: 'wall', src: p }); break;
      case 'slider': { const s = osc(t, p.period, p.phase);
        out.push({ k: 'rect', x: p.x + (p.dx || 0) * s, y: p.y + (p.dy || 0) * s, w: p.w, h: p.h, c: 'haz', src: p }); break; }
      case 'bar': { const n = p.blades || 1, base = (p.phase || 0) * TAU + t * p.rpm * TAU / 60;
        for (let k = 0; k < n; k++){ const a = base + k * TAU / n, cx = Math.cos(a), sy = Math.sin(a);
          if (p.anchor === 'end') out.push({ k: 'cap', ax: p.x, ay: p.y, bx: p.x + cx * p.len, by: p.y + sy * p.len, r: p.thick / 2, c: 'haz', src: p });
          else out.push({ k: 'cap', ax: p.x - cx * p.len / 2, ay: p.y - sy * p.len / 2, bx: p.x + cx * p.len / 2, by: p.y + sy * p.len / 2, r: p.thick / 2, c: 'haz', src: p }); }
        break; }
      case 'pulser': { const s = osc(t, p.period, p.phase);
        out.push({ k: 'circ', x: p.x, y: p.y, r: p.rmin + (p.rmax - p.rmin) * s, c: 'haz', src: p }); break; }
      case 'orbit': { const a = (p.phase || 0) * TAU + t * p.rpm * TAU / 60;
        out.push({ k: 'circ', x: p.x + Math.cos(a) * p.R, y: p.y + Math.sin(a) * p.R, r: p.r, c: 'haz', src: p }); break; }
      case 'gate': { const on = frac(t / p.period + (p.phase || 0)) < p.duty;
        out.push({ k: 'cap', ax: p.ax, ay: p.ay, bx: p.bx, by: p.by, r: p.thick / 2, c: 'laser', on, src: p }); break; }
      case 'blink': { const on = frac(t / p.period + (p.phase || 0)) < p.duty;
        out.push({ k: 'rect', x: p.x, y: p.y, w: p.w, h: p.h, c: 'blink', on, src: p }); break; }
      case 'shooter': { const nb = Math.ceil(p.range / (p.speed * p.interval)), f = frac(t / p.interval + (p.phase || 0));
        for (let k = 0; k < nb; k++){ const d = (f + k) * p.interval * p.speed; if (d > p.range) break;
          out.push({ k: 'circ', x: p.x + p.dx * d, y: p.y + p.dy * d, r: p.r, c: 'haz', src: p }); }
        break; }
    }
  }
  return out;
}
// ---- 画面の振動: ピースごとの「山」(0..1) と、部屋全体の揺れ ----
// 揺れは時刻だけで決まる（リプレイで止めても戻しても同じ）。判定とカーソルには関わらない。
const SHAKE = { on: true, gain: 1, lens: true }; // 設定（V で切替、[ ] で強さ、ラボでは L でカーソル周りの固定を切替）
function fireEnv(k, on){ // 照射の山。k = 照射開始からの秒。立ち上がり 50ms、照射中は少し落ち着き、終わりは余韻
  if (k < 0) return 0;
  if (k <= on) return Math.min(1, k / 0.05) * (0.72 + 0.28 * Math.exp(-k * 7));
  return 0.72 * Math.exp(-(k - on) * 12);
}
function shakeEnv(p, t){
  switch (p.t){
    case 'beam': case 'rotlaser': { const cyc = p.on + p.warn + p.off; return fireEnv(frac(t / cyc + (p.phase || 0)) * cyc - p.warn, p.on); } // 照射している間だけ（予告中は揺れない）
    case 'gate': case 'blink': case 'warnfloor': return fireEnv(frac(t / p.period + (p.phase || 0)) * p.period, p.duty * p.period); // 点いている間
    case 'crusher': return Math.exp(-frac(t / p.period + (p.phase || 0) - 0.5) * p.period * 9);  // 顎が閉じきった瞬間
    case 'slider': return Math.exp(-frac(2 * (t / p.period + (p.phase || 0))) * p.period / 2 * 9); // 端に当たった瞬間
    case 'pulser': return Math.exp(-frac(t / p.period + (p.phase || 0) - 0.5) * p.period * 8);   // 膨らみきった瞬間
    case 'shooter': return Math.exp(-frac(t / p.interval + (p.phase || 0)) * p.interval * 16);   // 1発ごとの反動
    case 'aimed': return t > 0 ? Math.exp(-frac(t / p.interval) * p.interval * 16) : 0;
    case 'mine': { const s = PSTATE.get(p.id || p), ph = s && s.ph; return ph === 'blast' ? 1 : ph === 'armed' ? 0.2 : 0; } // 爆発中
  }
  return 1; // 山のない型は、shake を書いたら出ている間ずっと揺れる
}
function roomShake(pieces, t){ // 部屋全体の揺れ幅(px)。複数が重なったら二乗和で足す
  if (!SHAKE.on) return 0; let e = 0;
  for (const p of pieces){ const a = p.shake !== undefined ? p.shake : (T.SHAKE.DEFAULT[p.t] || 0); if (a > 0){ const v = a * shakeEnv(p, t); e += v * v; } }
  return Math.min(T.SHAKE.MAX, Math.sqrt(e)) * SHAKE.gain;
}
function shakeOffset(amp, t){ // 揺れ幅と時刻 → ずらす量。周波数の違う波を重ねて不規則に見せる
  if (!(amp > 0.05)) return { x: 0, y: 0, amp: 0 };
  return { x: amp * (Math.sin(t * 107.3 + 1.3) + 0.6 * Math.sin(t * 183.1 + 4.1)) / 1.6, y: amp * (Math.sin(t * 119.7 + 2.9) + 0.6 * Math.sin(t * 151.9 + 0.7)) / 1.6, amp };
}

// 設置の検証（server.js と同じもの）
function bounds(p){
  switch (p.t){
    case 'wall': case 'blink': return { x: p.x, y: p.y, w: p.w, h: p.h };
    case 'slider': return { x: p.x + Math.min(0, p.dx || 0), y: p.y + Math.min(0, p.dy || 0), w: p.w + Math.abs(p.dx || 0), h: p.h + Math.abs(p.dy || 0) };
    case 'bar': { const r = (p.anchor === 'end' ? p.len : p.len / 2) + p.thick / 2; return { x: p.x - r, y: p.y - r, w: 2 * r, h: 2 * r }; }
    case 'pulser': return { x: p.x - p.rmax, y: p.y - p.rmax, w: 2 * p.rmax, h: 2 * p.rmax };
    case 'orbit': { const r = p.R + p.r; return { x: p.x - r, y: p.y - r, w: 2 * r, h: 2 * r }; }
    case 'gate': { const r = p.thick / 2; return { x: Math.min(p.ax, p.bx) - r, y: Math.min(p.ay, p.by) - r, w: Math.abs(p.ax - p.bx) + 2 * r, h: Math.abs(p.ay - p.by) + 2 * r }; }
    case 'shooter': { const ex = p.x + p.dx * p.range, ey = p.y + p.dy * p.range, r = p.r; return { x: Math.min(p.x, ex) - r, y: Math.min(p.y, ey) - r, w: Math.abs(ex - p.x) + 2 * r, h: Math.abs(ey - p.y) + 2 * r }; }
    case 'rotlaser': case 'aimed': case 'shadow': case 'beam': return { x: p.x - 20, y: p.y - 20, w: 40, h: 40 };
    case 'rain': return { x: p.x, y: 0, w: p.w, h: T.H };
    case 'slidelaser': return { x: p.x - p.dx / 2 - p.thick, y: p.y - p.len / 2, w: p.dx + 2 * p.thick, h: p.len };
    case 'crusher': return { x: p.x, y: p.y - p.h / 2, w: p.w, h: p.h };
    case 'stretch': { const r = p.lmax / 2 + p.thick / 2; return { x: p.x - r, y: p.y - r, w: 2 * r, h: 2 * r }; }
    case 'mine': return { x: p.x - p.blast, y: p.y - p.blast, w: 2 * p.blast, h: 2 * p.blast };
    case 'warnfloor': case 'speedzone': case 'nostop': return { x: p.x, y: p.y, w: p.w, h: p.h };
    case 'chaser': return { x: p.x - p.r, y: p.y - p.r, w: 2 * p.r, h: 2 * p.r };
  }
  return { x: p.x, y: p.y, w: 0, h: 0 };
}
// 横断レーザーの線が点 c から r 以内を通るか（パッドを貫く置き方を禁止するため）
function beamNear(p, c, r){ const a = (p.deg || 0) * Math.PI / 180; return Math.abs((c.x - p.x) * Math.sin(a) - (c.y - p.y) * Math.cos(a)) <= r + p.thick / 2; }
const SIZABLE = new Set(['speedzone', 'nostop']);
function translate(p, cx, cy){ const q = { ...p }; if (p.t === 'gate'){ q.ax += cx; q.bx += cx; q.ay += cy; q.by += cy; } else { q.x += cx; q.y += cy; } return q; }
function rectCircleClear(b, c, r){ const dx = Math.max(b.x - c.x, 0, c.x - (b.x + b.w)), dy = Math.max(b.y - c.y, 0, c.y - (b.y + b.h)); return Math.hypot(dx, dy) > r; }
// 設置結果のピースを作る（server.js と同じ）。範囲指定は {x,y,w,h}、それ以外は中心 {x,y}
function materialize(rel, m){
  if (SIZABLE.has(rel.t)){
    const w = Math.round(+m.w), h = Math.round(+m.h), x = Math.round(+m.x), y = Math.round(+m.y);
    if (![w, h, x, y].every(Number.isFinite) || w < 80 || h < 80) return null;
    return { ...rel, x, y, w, h };
  }
  const cx = Math.round(+m.x), cy = Math.round(+m.y);
  if (!Number.isFinite(cx) || !Number.isFinite(cy) || cx < 0 || cy < 0 || cx > T.W || cy > T.H) return null;
  return translate(rel, cx, cy);
}
function placementOk(p, start, goal){
  const b = bounds(p), mustFit = ['wall', 'blink', 'slider', 'gate', 'crusher', 'slidelaser', 'warnfloor', 'speedzone', 'nostop', 'rain'].includes(p.t);
  if (mustFit && (b.x < 0 || b.y < 0 || b.x + b.w > T.W || b.y + b.h > T.H)) return false;
  if (p.t === 'beam' && (beamNear(p, start, T.PAD_R + 10) || beamNear(p, goal, T.PAD_R + 10))) return false;
  return rectCircleClear(b, start, T.PAD_R + 10) && rectCircleClear(b, goal, T.PAD_R + 10);
}
// ドラッグ矩形 → 設置メッセージ。ほぼ動かさずに離したら既定サイズを中心に置く
function dragRect(a, b, rel){
  const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
  if (w < 30 && h < 30) return { x: Math.round(a.x - rel.w / 2), y: Math.round(a.y - rel.h / 2), w: rel.w, h: rel.h };
  return { x: Math.round(Math.min(a.x, b.x)), y: Math.round(Math.min(a.y, b.y)), w: Math.max(80, Math.round(w)), h: Math.max(80, Math.round(h)) };
}

// ===================== 幾何 =====================
function segPointDist(ax, ay, bx, by, px, py){
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let u = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; u = u < 0 ? 0 : u > 1 ? 1 : u;
  const x = ax + dx * u - px, y = ay + dy * u - py; return Math.hypot(x, y);
}
function orient(ax, ay, bx, by, cx, cy){ return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax); }
function segIntersect(ax, ay, bx, by, cx, cy, dx, dy){
  const o1 = orient(ax, ay, bx, by, cx, cy), o2 = orient(ax, ay, bx, by, dx, dy), o3 = orient(cx, cy, dx, dy, ax, ay), o4 = orient(cx, cy, dx, dy, bx, by);
  return (o1 * o2 < 0) && (o3 * o4 < 0);
}
function segSegDist(ax, ay, bx, by, cx, cy, dx, dy){
  if (segIntersect(ax, ay, bx, by, cx, cy, dx, dy)) return 0;
  return Math.min(segPointDist(ax, ay, bx, by, cx, cy), segPointDist(ax, ay, bx, by, dx, dy), segPointDist(cx, cy, dx, dy, ax, ay), segPointDist(cx, cy, dx, dy, bx, by));
}
// Liang–Barsky: 線分 vs 矩形（点なら内包判定になる）
function segRect(x0, y0, x1, y1, xmin, ymin, xmax, ymax){
  let t0 = 0, t1 = 1; const dx = x1 - x0, dy = y1 - y0;
  const p = [-dx, dx, -dy, dy], q = [x0 - xmin, xmax - x0, y0 - ymin, ymax - y0];
  for (let i = 0; i < 4; i++){
    if (p[i] === 0){ if (q[i] < 0) return false; }
    else { const r = q[i] / p[i]; if (p[i] < 0){ if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; } }
  }
  return true;
}
// 掃引: 前位置 a → 現位置 b の線分（半径 r）がプリミティブに触れるか
function hit(pr, ax, ay, bx, by, r){
  if (pr.on === false) return false;
  if (pr.k === 'rect') return segRect(ax, ay, bx, by, pr.x - r, pr.y - r, pr.x + pr.w + r, pr.y + pr.h + r);
  if (pr.k === 'circ') return segPointDist(ax, ay, bx, by, pr.x, pr.y) <= pr.r + r;
  if (pr.k === 'cap') return segSegDist(ax, ay, bx, by, pr.ax, pr.ay, pr.bx, pr.by) <= pr.r + r;
  return false;
}
function sweepHit(ps, ax, ay, bx, by){
  const r = T.HEAD_R;
  if (bx < r || by < r || bx > T.W - r || by > T.H - r) return 'bounds';
  for (const pr of ps) if (hit(pr, ax, ay, bx, by, r)) return pr;
  return null;
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

// ===================== ソルバー（デイリーの検証・パー計算・BOTゴースト） =====================
// ハザードは時刻の純関数なので、格子上の「到達できるセルの集合」を1ステップずつ広げるだけで最短時間が出る。
// 移動の条件: 行き先は移動前後の両時刻で空き、出発元も移動後の時刻で空き（動く障害物とのすれ違いを防ぐ）。
const SV = { G: 16, V: 500, M: 16, HORIZON: 25, PAD_SAFE: 50, GOAL_R: 34 }; // セル幅px / BOT速度px/s / 余白px / 打ち切り秒 / パッドの安全半径 / ゴール判定半径
function solveRoom(room, from, exit, t0, wantPath, horizon, prof){
  const P = prof || SV, g = SV.G, nx = Math.ceil(T.W / g), ny = Math.ceil(T.H / g), n = nx * ny, dt = g / P.V, m = P.M;
  const paint = (buf, ps) => {
    for (const pr of ps){
      if (pr.on === false) continue;
      const rr = (pr.k === 'rect' ? 0 : pr.r) + m;
      const x0 = pr.k === 'rect' ? pr.x - m : pr.k === 'circ' ? pr.x - rr : Math.min(pr.ax, pr.bx) - rr, x1 = pr.k === 'rect' ? pr.x + pr.w + m : pr.k === 'circ' ? pr.x + rr : Math.max(pr.ax, pr.bx) + rr;
      const y0 = pr.k === 'rect' ? pr.y - m : pr.k === 'circ' ? pr.y - rr : Math.min(pr.ay, pr.by) - rr, y1 = pr.k === 'rect' ? pr.y + pr.h + m : pr.k === 'circ' ? pr.y + rr : Math.max(pr.ay, pr.by) + rr;
      const i0 = Math.max(0, Math.ceil((x0 - g / 2) / g)), i1 = Math.min(nx - 1, Math.floor((x1 - g / 2) / g)), j0 = Math.max(0, Math.ceil((y0 - g / 2) / g)), j1 = Math.min(ny - 1, Math.floor((y1 - g / 2) / g));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++){ if (pr.k === 'rect' || hit(pr, i * g + g / 2, j * g + g / 2, i * g + g / 2, j * g + g / 2, m)) buf[j * nx + i] = 1; }
    }
  };
  const base = new Uint8Array(n);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++){ const cx = i * g + g / 2, cy = j * g + g / 2; if (cx < m || cy < m || cx > T.W - m || cy > T.H - m) base[j * nx + i] = 1; }
  paint(base, prims({ pieces: room.pieces.filter(p => p.t === 'wall') }, 0));
  const dyn = { pieces: room.pieces.filter(p => p.t !== 'wall') };
  const block = t => { const b = base.slice(); paint(b, prims(dyn, t)); return b; };
  const cell = p => Math.min(ny - 1, Math.max(0, Math.floor(p.y / g))) * nx + Math.min(nx - 1, Math.max(0, Math.floor(p.x / g)));
  const goals = []; for (let c = 0; c < n; c++){ const cx = (c % nx) * g + g / 2, cy = Math.floor(c / nx) * g + g / 2; if (!base[c] && Math.hypot(cx - exit.x, cy - exit.y) < SV.GOAL_R) goals.push(c); }

  reach[s0] = 1;
  const steps = Math.ceil((horizon || SV.HORIZON) / dt), hist = [], src = new Uint8Array(n);
  for (let k = 1; k <= steps; k++){
    const blkB = block(t0 + k * dt), next = new Uint8Array(n);
    for (let c = 0; c < n; c++) src[c] = reach[c] && !blkB[c] ? 1 : 0;
    for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++){ const c = j * nx + i; if (blkA[c] || blkB[c]) continue;
      if (src[c] || src[c - 1] || src[c + 1] || src[c - nx] || src[c + nx] || src[c - nx - 1] || src[c - nx + 1] || src[c + nx - 1] || src[c + nx + 1]) next[c] = 1; }
    if (wantPath) hist.push(src.slice());
    reach = next; blkA = blkB;
    const gc = goals.find(c => next[c]);
    if (gc !== undefined){
      const res = { ok: true, time: k * dt };
      if (wantPath){ // 逆にたどる。「早めに進んで手前で待つ」形にし、動くときは同じ向きを優先する
        const cells = [gc]; let c = gc, pd = 0;
        for (let q = k; q >= 1; q--){ const sr = hist[q - 1];
          if (!sr[c]){ let nb = pd && sr[c + pd] ? c + pd : -1;
            if (nb < 0) for (const dlt of [-1, 1, -nx, nx, -nx - 1, -nx + 1, nx - 1, nx + 1]) if (sr[c + dlt]){ nb = c + dlt; pd = dlt; break; }
            c = nb; }
          cells.push(c); }
        cells.reverse();
        res.path = cells.map((cc, q) => ({ x: (cc % nx) * g + g / 2, y: Math.floor(cc / nx) * g + g / 2, t: t0 + q * dt }));
      }
      return res;
    }
  }
  return { ok: false };
}
// パッドが「どの時刻でも」安全か。各ピースの届く範囲（最悪ケースの形）と比べるので時刻を回さない。
function padSafe(pieces, c, rad){
  const rc = b => !rectCircleClear(b, c, rad), ci = (x, y, r) => Math.hypot(c.x - x, c.y - y) <= r + rad;
  for (const p of pieces){
    switch (p.t){
      case 'wall': case 'blink': case 'warnfloor': case 'slider': case 'slidelaser': case 'crusher': case 'rain': if (rc(bounds(p))) return false; break;
      case 'bar': if (ci(p.x, p.y, (p.anchor === 'end' ? p.len : p.len / 2) + p.thick / 2)) return false; break;
      case 'stretch': if (ci(p.x, p.y, p.lmax / 2 + p.thick / 2)) return false; break;
      case 'pulser': if (ci(p.x, p.y, p.rmax)) return false; break;
      case 'rotlaser': if (ci(p.x, p.y, p.len + p.thick / 2)) return false; break;
      case 'beam': if (beamNear(p, c, rad)) return false; break;
      case 'orbit': { const d = Math.hypot(c.x - p.x, c.y - p.y); if (!(d + rad < p.R - p.r || d - rad > p.R + p.r)) return false; break; }
      case 'gate': if (segPointDist(p.ax, p.ay, p.bx, p.by, c.x, c.y) <= p.thick / 2 + rad) return false; break;
      case 'shooter': if (segPointDist(p.x, p.y, p.x + p.dx * p.range, p.y + p.dy * p.range, c.x, c.y) <= p.r + rad) return false; break;
      default: return false; // 状態を持つピースは対象外（デイリーでは使わない）
    }
  }
  return true;
}

// ===================== デイリーの用意 =====================
// 生成は1回 50ms 前後。部屋ごとに分けて走らせ、できたものは日付ごとに端末へ保存して次回は読むだけにする
const DAILIES = new Map(); // 日付 → course | { building, progress }
function ensureDaily(date){
  const have = DAILIES.get(date); if (have) return have.building ? null : have;
  const lk = 'cursorrun.daily.' + GEN_VER + '.' + date; let c = null;
  try { c = JSON.parse(LS.get(lk)); if (c && c.rooms && c.key) c.bot = decodeGhost(c.bot) || []; else c = null; } catch (e) { c = null; }
  if (c){ DAILIES.set(date, c); return c; }
  const st = { building: true, progress: 0 }; DAILIES.set(date, st);
  const g = dailyGen(date), step = () => {
    try {
      const r = g.next(); if (!r.done){ st.progress = r.value; setTimeout(step, 0); return; }
      const dc = r.value, packed = encodeGhost(dc.bot, dc.par * 1000); dc.bot = decodeGhost(packed) || [];
      DAILIES.set(date, dc); LS.set(lk, JSON.stringify({ ...dc, bot: packed }));
      const lim = dayShift(today(), -7); for (const k of LS.keys()) if (k && k.indexOf('cursorrun.daily.') === 0 && k.slice(-10) < lim) LS.del(k);
      if (BOARD.pending === date && (state === 'menu' || state === 'board')){ BOARD.pending = null; openBoard(dc); }
    } catch (e) { console.error(e); st.failed = true; }
  };
  setTimeout(step, 0); return null;
}
// 固定コースのBOT（最初にランキングを開いたときに1度だけ解く）。解けない部屋があれば BOT なし
function ensureBot(c){
  if (c.bot !== undefined) return; c.bot = null;
  const bot = []; let i = 0, t = 0, pos = c.start;
  const step = () => {
    const r = solveRoom(c.rooms[i], pos, c.rooms[i].exit, t, true, 40); if (!r.ok) return;
    for (const p of r.path) bot.push(Math.round(p.t * 1000), i, p.x, p.y, 1);
    t += r.time; pos = r.path[r.path.length - 1];
    if (++i < c.rooms.length) setTimeout(step, 0); else { c.par = Math.round(t * 100) / 100; c.bot = decodeGhost(encodeGhost(bot, c.par * 1000)) || []; }
  };
  setTimeout(step, 0);
}
// 尻尾: カーソルが通った位置にドットを落とし、TRAIL_LIFE 秒で消える
function dropDot(tr, x, y, now){
  const last = tr[tr.length - 1];
  if (last && Math.hypot(last.x - x, last.y - y) < T.TRAIL_GAP) return;
  tr.push({ x, y, t: now });
}
function pruneTrail(tr, now){ const lim = now - T.TRAIL_LIFE * 1000; let i = 0; while (i < tr.length && tr[i].t < lim) i++; if (i) tr.splice(0, i); }

// ===================== 更新（シングル） =====================
let lastNow = performance.now();
function hazardTime(now){
  if (state === 'race' || state === 'dead' || state === 'done') return elapsed;
  if (state === 'count') return 0;
  return now / 1000; // タイトル中はプレビューで動かす
}
// メニュー・ランキング・リプレイ共通: カーソルを動かして尻尾を落とすだけ
function uiCursor(now){
  for (const s of samples){ if (s.out){ have = false; continue; } have = true; cur = s; dropDot(trail, cur.x, cur.y, now); }
  samples.length = 0; pruneTrail(trail, now);
}
function update(now){
  const dt = Math.max(0, Math.min(0.05, (now - lastNow) / 1000)); lastNow = now;
  if (toastT && now > toastT){ toastT = 0; H.toast.hidden = true; }
  if (state === 'mp'){ mpUpdate(now, dt); return; }
  if (state === 'board'){ boardUpdate(now, dt); return; }
  if (state === 'watch'){ watchUpdate(now, dt); return; }
  if (state === 'done' && msgVer !== NET.ver) setMsg(doneBest); // 順位が届いたら結果表示を更新
  if (state === 'race' || state === 'dead') elapsed = (now - goTime) / 1000;
  const room = ROOMS[roomIdx], ht = hazardTime(now);
  const prevCur = { x: cur.x, y: cur.y }, hadCur = have;
  const env = { t: ht, dt, cur, prev: hadCur ? prevCur : null, have, speed, history };
  if (state !== 'menu') stepPieces(room.pieces, env);
  const ps = state === 'menu' ? [] : prims(room, ht, env);

  for (const s of samples){
    if (s.out){ if (state === 'race') die('out'); else if (state === 'count'){ state = 'title'; falseStarts++; flyFlash = 1; setMsg(); } have = false; continue; }
    have = true;
    if (state === 'race'){
      const h = sweepHit(ps, cur.x, cur.y, s.x, s.y);
      if (h){ cur = s; die(h); continue; }
    }
    cur = s;
    if (state !== 'dead') dropDot(trail, cur.x, cur.y, now);
    if (state === 'title'){ if (dist(cur, START) < T.PAD_R){ state = 'count'; countEnd = now + T.COUNTDOWN * 1000; setMsg(); } }
    else if (state === 'count'){ if (dist(cur, START) > T.PAD_R){ state = 'title'; falseStarts++; flyFlash = 1; setMsg(); } }
    else if (state === 'dead'){ if (dist(cur, cp) < T.PAD_R * 0.8) state = 'race'; }
  }
  samples.length = 0;
  if (state === 'menu'){
    const td = today(), dc = ensureDaily(td); // 日付が変わったらその場で次のデイリーを用意する
    if (dc && NET.mode === 'api' && now > BOARD.menuPollAt){ BOARD.menuPollAt = now + 30000; netBoard(boardKey(dc)); }
    for (const c of clicks){
      if (inRect(c, menuNameChip())){ openName(); break; }
      if (inRect(c, menuLabChip())){ openLab(); break; }
      for (const card of menuCards()) if (state === 'menu' && inRect(c, card)){ if (card.kind === 'course') openBoard(card.c); else if (card.kind === 'daily') openDaily(td); else mpEnter(); }
    }
  }
  clicks.length = 0; ups.length = 0;
  if (state === 'mp' || state === 'board'){ draw(now, null, [], 0); return; }
  speed = dt > 0 && hadCur && have ? dist(prevCur, cur) / dt : 0; if (state === 'race') maxSpeed = Math.max(maxSpeed, speed);
  env.cur = cur; env.have = have; env.speed = speed;
  if (state === 'race' && have){ history.push({ x: cur.x, y: cur.y, t: elapsed }); while (history.length && history[0].t < elapsed - 10) history.shift(); }

  if (state === 'count' && now >= countEnd){ state = 'race'; goTime = now; elapsed = 0; gRec = []; gLastT = -1; history = []; resetPieceState(); for (const g of raceGhosts){ g.gi = 0; g.trail = []; } }
  if (state === 'race' && have){
    // 静止中に突っ込んでくる障害物、区画ルール
    const h = sweepHit(ps, cur.x, cur.y, cur.x, cur.y) || ruleHit(room.pieces, env); if (h) die(h);
  }
  if (state === 'race'){
    for (const c of room.cps){ if (dist(cur, c) < T.PAD_R && !cpsHit.has(c)){ cpsHit.add(c); cp = c; } }
    if (dist(cur, room.exit) < T.PAD_R){
      if (roomIdx === ROOMS.length - 1) finish(); else { splits.push(elapsed); enterRoom(roomIdx + 1); }
    }
  }
  // ゴースト記録
  if ((state === 'race' || state === 'dead') && elapsed - gLastT >= 1 / T.GHOST_HZ){ gLastT = elapsed; gRec.push(Math.round(elapsed * 1000), roomIdx, Math.round(cur.x), Math.round(cur.y), state === 'race' ? 1 : 0); }

  pruneTrail(trail, now); for (const g of raceGhosts) pruneTrail(g.trail, now);
  stepParticles(dt);
  flyFlash = Math.max(0, flyFlash - dt * 2);

  // HUD
  const inMenu = state === 'menu';
  H.time.textContent = inMenu ? '' : fmt(state === 'done' ? finalTime : elapsed);
  H.room.textContent = inMenu ? '' : `ROOM ${roomIdx + 1}/${ROOMS.length}`; H.name.textContent = inMenu ? '' : `${course.name} · ${room.name}`;
  H.deaths.textContent = deaths; H.best.textContent = best ? fmt(best.time) : '--';
  if (debug) H.dbg.textContent = `speed ${Math.round(speed)} px/s · max ${Math.round(maxSpeed)} · false starts ${falseStarts} · state ${state}`;
  draw(now, room, ps, ht);
}
function stepParticles(dt){
  for (const p of particles){ p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
}

// ===================== マルチプレイ（Ultimate Chicken Horse 方式） =====================
// サーバー(server.js)がフェーズを進め、クライアントは当たり判定と申告を担当する。
const MP = { ws: null, id: null, offset: 0, snap: null, me: null, others: {}, status: 'idle', posT: 0, note: '', noteT: 0, drag: null };
const MP_START = { x: 90, y: 360 }, MP_GOAL = { x: 1190, y: 360 };
const PHASE_LABEL = { lobby: 'LOBBY', box: 'ピースを選べ', place: '設置せよ', count: 'スタートパッドに乗れ', run: 'GO', results: 'RESULT', final: 'WINNER' };
function myName(){
  if (ME.name) return ME.name;
  const u = new URLSearchParams(location.search).get('name'); if (u) return ME.name = u.slice(0, 12);
  let n = LS.get('cursorrun.name');
  if (!n){ const L = ['ひよこ', 'うま', 'ねこ', 'いぬ', 'かえる', 'さる', 'きつね', 'くま']; n = L[Math.floor(Math.random() * L.length)] + Math.floor(10 + Math.random() * 90); LS.set('cursorrun.name', n); }
  return ME.name = n;
}
function mpNote(s, ms){ MP.note = s; MP.noteT = ms === Infinity ? Infinity : performance.now() + (ms || 2000); }
function mpSend(o){ if (MP.ws && MP.ws.readyState === 1) MP.ws.send(JSON.stringify(o)); }
function serverNow(){ return Date.now() + MP.offset; }
function mpEnter(){
  state = 'mp'; trail = []; particles = []; deaths = 0; MP.snap = null; MP.me = null; MP.others = {}; MP.status = 'idle'; H.line3.hidden = true; setMsg();
  if (!/^https?:$/.test(location.protocol)){ mpNote('ONLINE は node server.js で起動した http://localhost:8080 で開くと遊べます（M でメニュー）', Infinity); return; }
  mpNote('接続中…', Infinity);
  try {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host); MP.ws = ws;
    ws.onopen = () => { mpNote('', 0); ws.send(JSON.stringify({ t: 'join', room: new URLSearchParams(location.search).get('room') || 'main', name: myName() })); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } mpMsg(m); };
    ws.onerror = () => mpNote('サーバーに接続できません。node server.js で起動したURLで開いてください（M でメニュー）', Infinity);
    ws.onclose = () => { MP.ws = null; if (state === 'mp' && MP.snap) mpNote('切断されました（M でメニュー）', Infinity); };
  } catch (e) { mpNote('WebSocket を開けません（M でメニュー）', Infinity); }
}
function mpLeave(){ if (MP.ws){ MP.ws.onclose = null; MP.ws.close(); MP.ws = null; } toMenu(); }
function mpMsg(m){
  if (m.t === 'hello'){ MP.id = m.id; MP.offset = m.now - Date.now(); }
  else if (m.t === 'state'){
    MP.offset = m.now - Date.now();
    const prev = MP.snap; MP.snap = m; MP.me = m.players.find(p => p.id === MP.id) || null;
    if (!prev || prev.phase !== m.phase){
      if (m.phase === 'count'){ MP.status = 'waiting'; trail = []; particles = []; history = []; resetPieceState(); }
      if (m.phase === 'place') MP.drag = null;
      if (m.phase === 'box' || m.phase === 'lobby') MP.status = 'idle';
      if (m.phase === 'results' || m.phase === 'final') for (const id in MP.others) MP.others[id].trail = [];
    }
    for (const id in MP.others) if (!m.players.some(p => p.id === id)) delete MP.others[id];
  }
  else if (m.t === 'pos'){ const o = MP.others[m.id] || (MP.others[m.id] = { x: m.x, y: m.y, trail: [] }); o.x = m.x; o.y = m.y; dropDot(o.trail, m.x, m.y, performance.now()); }
  else if (m.t === 'reject') mpNote('そこには置けない');
  else if (m.t === 'full') mpNote('部屋が満員です（M でメニュー）', Infinity);
}
function mpKeyReady(){ if (MP.snap && MP.snap.phase === 'lobby') mpSend({ t: 'ready' }); }
function mpKeyPass(){ if (MP.snap && MP.snap.phase === 'place' && MP.me && !MP.me.placed) mpSend({ t: 'pass' }); }
function mpHazardTime(){
  const s = MP.snap; if (!s) return 0;
  if (s.phase === 'count') return 0;
  if (s.phase === 'run' || s.phase === 'results' || s.phase === 'final') return Math.max(0, (serverNow() - s.runStart) / 1000);
  return serverNow() / 1000; // 設置中はサーバー時刻で同期したプレビュー
}
function mpDie(h){
  MP.status = 'dead'; deaths++;
  mpSend({ t: 'dead', by: h && h.src && h.src.owner ? h.src.owner : null });
  burst(MP.me ? MP.me.color : '#5ee1ff');
}
const mpReadyBtn = () => ({ x: 540, y: 600, w: 200, h: 60 });
function mpBoxCards(){
  const s = MP.snap, n = s.box.length, gap = 20, w = Math.min(200, (T.W - 80 - (n - 1) * gap) / n), h = 170, x0 = (T.W - (n * w + (n - 1) * gap)) / 2, y = 290;
  return s.box.map((b, i) => ({ x: x0 + i * (w + gap), y, w, h }));
}
function mpUpdate(now, dt){
  const s = MP.snap, phase = s ? s.phase : 'connecting', ht = mpHazardTime();
  const level = s ? s.level : [], prevCur = { x: cur.x, y: cur.y }, hadCur = have;
  const env = { t: ht, dt, cur, prev: hadCur ? prevCur : null, have, speed, history };
  stepPieces(level, env);
  const ps = prims({ pieces: level }, ht, env);
  const racing = phase === 'run' && MP.status === 'running';
  for (const smp of samples){
    if (smp.out){ if (racing) mpDie(null); have = false; continue; }
    have = true;
    if (phase === 'run' && MP.status === 'running'){ const h = sweepHit(ps, cur.x, cur.y, smp.x, smp.y); if (h){ cur = smp; mpDie(h); continue; } }
    cur = smp; if (MP.status !== 'dead') dropDot(trail, cur.x, cur.y, now);
  }
  samples.length = 0;
  speed = dt > 0 && hadCur && have ? dist(prevCur, cur) / dt : 0;
  env.cur = cur; env.have = have; env.speed = speed;
  if (phase === 'run' && have){ history.push({ x: cur.x, y: cur.y, t: ht }); while (history.length && history[0].t < ht - 10) history.shift(); }
  if (phase === 'run' && MP.status === 'running' && have){ const h = sweepHit(ps, cur.x, cur.y, cur.x, cur.y); if (h) mpDie(h); else { const r = ruleHit(level, env); if (r) mpDie({ src: r }); } }
  if (phase === 'run' && MP.status === 'waiting' && have && dist(cur, MP_START) < T.PAD_R){ MP.status = 'running'; mpSend({ t: 'start' }); }
  if (phase === 'run' && MP.status === 'running' && dist(cur, MP_GOAL) < T.PAD_R){ MP.status = 'finished'; mpSend({ t: 'finish' }); }
  const canPlace = phase === 'place' && MP.me && MP.me.pick !== null && !MP.me.placed;
  for (const c of clicks){
    if (!s) continue;
    if (phase === 'lobby'){ if (inRect(c, mpReadyBtn())) mpSend({ t: 'ready' }); }
    else if (phase === 'box' && MP.me && MP.me.pick === null){ mpBoxCards().forEach((card, i) => { if (inRect(c, card) && s.box[i].takenBy === null) mpSend({ t: 'pick', i }); }); }
    else if (canPlace){
      const b = s.box[MP.me.pick];
      if (b.sizable) MP.drag = { x: c.x, y: c.y }; // 範囲指定はドラッグで決める
      else { const piece = materialize(b.piece, { x: c.x, y: c.y }); if (piece && placementOk(piece, MP_START, MP_GOAL)) mpSend({ t: 'place', x: Math.round(c.x), y: Math.round(c.y) }); else mpNote('そこには置けない'); }
    }
  }
  for (const u of ups){
    if (MP.drag && canPlace){ const b = s.box[MP.me.pick], r = dragRect(MP.drag, u, b.piece), piece = materialize(b.piece, r); MP.drag = null;
      if (piece && placementOk(piece, MP_START, MP_GOAL)) mpSend({ t: 'place', ...r }); else mpNote('そこには置けない（パッドを覆うか、画面外）'); }
    else MP.drag = null;
  }
  clicks.length = 0; ups.length = 0;
  if (have && now - MP.posT > 1000 / T.POS_HZ){ MP.posT = now; mpSend({ t: 'pos', x: Math.round(cur.x), y: Math.round(cur.y) }); }
  pruneTrail(trail, now); for (const id in MP.others) pruneTrail(MP.others[id].trail, now);
  stepParticles(dt);
  // HUD
  const left = s ? Math.max(0, (s.deadline - serverNow()) / 1000) : 0;
  H.time.textContent = !s ? '' : phase === 'run' ? fmt(Math.max(0, (serverNow() - s.runStart) / 1000)) : phase === 'count' ? Math.ceil(left) + '' : left.toFixed(0);
  H.room.textContent = s ? `ROUND ${s.round}` : 'ONLINE'; H.name.textContent = s && MP.me ? `${MP.me.name} · ${MP.me.score} / ${s.target} pt` : '';
  if (debug) H.dbg.textContent = `phase ${phase} · status ${MP.status} · offset ${Math.round(MP.offset)}ms · speed ${Math.round(speed)}`;
  draw(now, null, ps, ht, level, env);
}

// ===================== 描画 =====================
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
const C = {};
function cacheColors(){ for (const n of ['arena','grid','wall','wall-edge','haz','laser','start','cp','exit','player','ghost','dim','fg','card','card-hi']) C[n] = css('--' + n); }
cacheColors();

function pad(x, y, r, color, label, strong){
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = color; ctx.globalAlpha = strong ? 0.28 : 0.1; ctx.fill();
  ctx.globalAlpha = strong ? 1 : 0.5; ctx.lineWidth = 3; ctx.strokeStyle = color; ctx.stroke();
  if (label){ ctx.globalAlpha = strong ? 1 : 0.6; ctx.fillStyle = color; ctx.font = '700 13px ' + css('--font'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y); }

}
function goal(x, y, r){
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  const n = 8, s = (r * 2) / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){ ctx.fillStyle = (i + j) % 2 ? '#f2f4f8' : '#1a1f2c'; ctx.fillRect(x - r + i * s, y - r + j * s, s, s); }
  ctx.restore(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.lineWidth = 3; ctx.strokeStyle = C.exit; ctx.stroke();
}
function drawTrail(tr, color, alpha, now){
  if (!tr.length) return;
  ctx.save(); ctx.fillStyle = color;
  for (const d of tr){
    const f = 1 - (now - d.t) / (T.TRAIL_LIFE * 1000); if (f <= 0) continue;
    ctx.globalAlpha = alpha * f; ctx.beginPath(); ctx.arc(d.x, d.y, T.TRAIL_R * (0.3 + 0.7 * f), 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function head(x, y, color, alpha, hollow){
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.shadowColor = color; ctx.shadowBlur = hollow ? 0 : 18;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, TAU);
  if (hollow){ ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.setLineDash([3, 3]); ctx.stroke(); }
  else { ctx.fillStyle = color; ctx.fill(); ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); }
  ctx.restore();
}
// 走行中のゴースト位置（時刻は前にしか進まないので添字を覚えておく）
function ghostPose(g){
  if (!ghostOn || !(state === 'race' || state === 'dead')) return null;
  const s = g.s, n = s.length / 5, ms = elapsed * 1000;
  while (g.gi + 1 < n && s[(g.gi + 1) * 5] <= ms) g.gi++;
  if (g.gi >= n) return null;
  const a = g.gi * 5, b = Math.min(n - 1, g.gi + 1) * 5;
  if (s[a + 1] !== roomIdx) return { room: s[a + 1] };
  let x = s[a + 2], y = s[a + 3];
  if (s[b + 1] === roomIdx && s[b] > s[a]){ const u = Math.min(1, (ms - s[a]) / (s[b] - s[a])); x += (s[b + 2] - x) * u; y += (s[b + 3] - y) * u; }
  return { room: roomIdx, x, y, alive: s[a + 4] === 1 };
}
// リプレイ用: 任意の時刻の位置（二分探索なのでシークできる）
function poseAt(s, ms){
  const n = s.length / 5; if (!n) return null;
  let lo = 0, hi = n - 1; while (lo < hi){ const mid = (lo + hi + 1) >> 1; if (s[mid * 5] <= ms) lo = mid; else hi = mid - 1; }
  const a = lo * 5, b = Math.min(n - 1, lo + 1) * 5; let x = s[a + 2], y = s[a + 3];
  if (s[b + 1] === s[a + 1] && s[b] > s[a] && ms > s[a]){ const u = Math.min(1, (ms - s[a]) / (s[b] - s[a])); x += (s[b + 2] - x) * u; y += (s[b + 3] - y) * u; }
  return { room: s[a + 1], x, y, alive: s[a + 4] === 1 };
}
function text(str, x, y, size, color, align, weight){

const DOW = '日月火水木金土';
function hms(ms){ const s = Math.max(0, Math.floor(ms / 1000)), p = v => String(v).padStart(2, '0'); return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s / 60) % 60) + ':' + p(s % 60); }
function menuNameChip(){ return { x: T.W - 15 - 250, y: 46, w: 250, h: 40 }; }

// ピース群の描画（ガイド → 本体 → 砲台の台座）
function zoneBox(p, color, label){ ctx.save(); ctx.fillStyle = color; ctx.globalAlpha = 0.08; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.globalAlpha = 0.6; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); ctx.strokeRect(p.x, p.y, p.w, p.h); ctx.setLineDash([]); ctx.globalAlpha = 1; text(label, p.x + 10, p.y + 14, 13, color); ctx.restore(); }
function hub(x, y, a, aimed){ ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fillStyle = '#1a1f2c'; ctx.fill(); ctx.strokeStyle = C.exit; ctx.lineWidth = 3; ctx.stroke(); if (aimed){ ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(22, 0); ctx.stroke(); } ctx.restore(); }
function drawPieces(pieces, ps, t){
  t = t || 0;
  ctx.save(); ctx.strokeStyle = C.haz; ctx.fillStyle = C.haz;
  for (const p of pieces){
    if (p.t === 'orbit'){ ctx.beginPath(); ctx.arc(p.x, p.y, p.R, 0, TAU); ctx.globalAlpha = 0.18; ctx.setLineDash([6, 8]); ctx.stroke(); ctx.setLineDash([]); }
    if (p.t === 'slider'){ ctx.globalAlpha = 0.06; ctx.fillRect(p.x + Math.min(0, p.dx || 0), p.y + Math.min(0, p.dy || 0), p.w + Math.abs(p.dx || 0), p.h + Math.abs(p.dy || 0)); }
    if (p.t === 'pulser'){ ctx.beginPath(); ctx.arc(p.x, p.y, p.rmax, 0, TAU); ctx.globalAlpha = 0.15; ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]); }
    if (p.t === 'shooter'){ ctx.globalAlpha = 0.12; ctx.setLineDash([4, 10]); ctx.lineWidth = p.r * 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.dx * p.range, p.y + p.dy * p.range); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1; }
    if (p.t === 'bar' && p.anchor === 'end'){ ctx.beginPath(); ctx.arc(p.x, p.y, p.len, 0, TAU); ctx.globalAlpha = 0.1; ctx.setLineDash([6, 8]); ctx.stroke(); ctx.setLineDash([]); }
    if (p.t === 'slidelaser'){ ctx.globalAlpha = 0.12; ctx.setLineDash([4, 8]); ctx.lineWidth = 2; ctx.strokeRect(p.x - p.dx / 2, p.y - p.len / 2, p.dx, p.len); ctx.setLineDash([]); }
    if (p.t === 'crusher'){ ctx.globalAlpha = 0.06; ctx.fillRect(p.x, p.y - p.h / 2, p.w, p.h); }
    if (p.t === 'rain'){ ctx.globalAlpha = 0.25; ctx.fillRect(p.x, 0, p.w, 6); ctx.globalAlpha = 0.05; ctx.fillRect(p.x, 0, p.w, T.H); }
    if (p.t === 'mine'){ ctx.globalAlpha = 0.12; ctx.setLineDash([3, 5]); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.trigger, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    if (p.t === 'warnfloor'){ const ph = frac(t / p.period + (p.phase || 0)), warn = ph > 1 - p.warn / p.period && ph >= p.duty; ctx.globalAlpha = warn ? 0.4 + 0.5 * Math.abs(Math.sin(t * 25)) : 0.2; ctx.lineWidth = warn ? 4 : 2; ctx.setLineDash(warn ? [] : [6, 6]); ctx.strokeRect(p.x, p.y, p.w, p.h); ctx.setLineDash([]); ctx.lineWidth = 1; }

    if (pr.k === 'rect'){

// ===================== ランキング画面 =====================
// コースを選ぶとまずここに来る。左に自分の記録と操作、右に順位表、下に部屋の一覧（動く縮小図）。
const GHOST_COLORS = ['#ffb14a', '#b980ff', '#49e07c', '#ff7ab8', '#7cf5d6'], BOT_COLOR = '#a9b6d1';
const BOARD = { sel: new Map(), scroll: 0, pollAt: 0, menuPollAt: 0, pending: null }; // sel: コース(キー) → 並走相手の pid の並び
const BL = { x: 500, y: 150, w: 740, rh: 34, max: 11 }; // 順位表の位置と行数
function openBoard(c){
  if (c.lab){ toMenu(); return; } // ラボにランキングは無い
  course = c; ROOMS = c.rooms; START = c.start; best = loadBest(c); state = 'board'; BOARD.scroll = 0; BOARD.pollAt = 0; BOARD.pending = null; trail = []; particles = []; H.line3.hidden = true;
  ensureBot(c); syncRec(c); setMsg();
}
function openDaily(date){ const c = ensureDaily(date); if (c) openBoard(c); else { BOARD.pending = date; toast('コースを生成中…'); } }
function boardNameChip(){ return { x: T.W - 40 - 250, y: 36, w: 250, h: 40 }; }
function boardButtons(){
  const b = [{ id: 'play', x: 40, y: 452, w: 190, h: 56, label: 'PLAY', go: true }, { id: 'watch', x: 240, y: 452, w: 110, h: 56, label: 'WATCH' }, { id: 'share', x: 360, y: 452, w: 110, h: 56, label: 'SHARE' }];
  if (course.daily){ const td = today(), d = course.daily.date; b.push({ id: 'prev', x: 40, y: 520, w: 136, h: 36, label: '◀ 前の日', off: dayNum(d) <= 1 }, { id: 'today', x: 187, y: 520, w: 136, h: 36, label: '今日', off: d === td }, { id: 'next', x: 334, y: 520, w: 136, h: 36, label: '次の日 ▶', off: d >= td }); }
  return b;
}
function boardAct(id){
  const b = boardButtons().find(q => q.id === id); if (!b || b.off) return;
  if (id === 'play') play();
  else if (id === 'share') doShare();
  else if (id === 'watch') startWatch(watchList(course), 0);
  else if (id === 'prev') openDaily(dayShift(course.daily.date, -1));
  else if (id === 'next') openDaily(dayShift(course.daily.date, 1));
  else if (id === 'today') openDaily(today());
}
function rowColor(c, r){ if (r.me) return C.player; const i = (BOARD.sel.get(boardKey(c)) || []).indexOf(r.pid); return i < 0 ? null : r.bot ? BOT_COLOR : GHOST_COLORS[i % GHOST_COLORS.length]; }
function toggleSel(c, r){
  if (r.me){ toast('自分のベストはいつも並走します（走行中 G で全ゴーストを切替）'); return; }
  const key = boardKey(c), sel = (BOARD.sel.get(key) || []).slice(), i = sel.indexOf(r.pid);
  if (i >= 0) sel.splice(i, 1); else if (sel.length >= 5){ toast('ゴーストは5つまで'); return; } else { sel.push(r.pid); ghostFor(c, r); }
  BOARD.sel.set(key, sel);
}
// 初回は自力で走ってもらう。自己ベストができたら「ひとつ上」と「1位」を相手に選んでおく（手で選び直したらそちらを優先）
function autoSelect(c){
  const key = boardKey(c); if (BOARD.sel.has(key) || netRows(key) === null) return;
  const rows = boardRows(c).filter(r => !r.bot), mi = rows.findIndex(r => r.me); if (mi < 0 || rows.length < 2) return;
  BOARD.sel.set(key, mi === 0 ? [rows[1].pid] : mi === 1 ? [rows[0].pid] : [rows[mi - 1].pid, rows[0].pid]);
}
// リプレイに出す走り: 選んだ相手＋自分。何も選んでいなければ先頭の行（1位。誰もいなければBOT）
function watchList(c){
  const rows = boardRows(c), sel = BOARD.sel.get(boardKey(c)) || []; let pick = rows.filter(r => sel.includes(r.pid));
  if (pick.length){ const me = rows.find(r => r.me); if (me) pick.push(me); } else pick = rows.slice(0, 1);
  const out = []; let loading = false;

    // リプレイ中は見ている人のカーソルを輪にする（再生中の自機と見分けるため）
    if (state === 'watch'){ if (have){ ctx.beginPath(); ctx.arc(cur.x, cur.y, 7, 0, TAU); ctx.strokeStyle = C.fg; ctx.lineWidth = 2; ctx.stroke(); } }
    else { drawTrail(trail, C.player, 0.9, now); if (have) head(cur.x, cur.y, C.player, 1, false); }
  }
  else if (state === 'mp') drawMulti(now, ps, ht, level || [], 'over');
  else drawSingle(now, room, ps, ht, 'over');
  // レターボックス外を暗く
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#07090f';
  if (ox > 0){ ctx.fillRect(0, 0, ox, cvs.height); ctx.fillRect(ox + T.W * s, 0, ox + 1, cvs.height); }
  if (oy > 0){ ctx.fillRect(0, 0, cvs.width, oy); ctx.fillRect(0, oy + T.H * s, cvs.width, oy + 1); }
}

for (const c of [mainCtx, fxCtx]) if (c && !c.roundRect) c.roundRect = function(x, y, w, h, r){ this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
// ===================== 起動 =====================
H.line3.hidden = true; setMsg(); for (const c of COURSES) loadBest(c); // 旧形式の自己ベストがあれば引き継ぐ
{ // 振動の設定を読む。未設定なら、OS で「視差効果を減らす」にしている人は切で始める
  const v = LS.get('cursorrun.shake'), g = parseFloat(LS.get('cursorrun.shakeGain'));
  SHAKE.on = v ? v === '1' : !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (g >= 0.25 && g <= 2) SHAKE.gain = g;
}
netInit(); ensureDaily(today());
function loop(now){ try { update(now); } catch (e) { console.error(e); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
