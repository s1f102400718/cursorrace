/* Layout: one fixed 16:9 arena letterboxed into the window; HUD floats over it. Single dark arcade theme by choice. */
:root{
  --bg:#07090f; --arena:#0d1220; --grid:#141b2d; --fg:#e6ecf5; --dim:#7d8aa3;
  --wall:#2b3650; --wall-edge:#5a6d94; --haz:#ff3b5c; --laser:#ff4fd8; --start:#49e07c; --cp:#4fd3ff; --exit:#ffd044;
  --player:#5ee1ff; --ghost:#8d97ad; --card:#121a2c; --card-hi:#1b2742;
  --font:"Chakra Petch",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#c{display:block;width:100%;height:100%;cursor:none;touch-action:none;user-select:none}
#hud{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));pointer-events:none;font-size:15px;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
#hud .big{font-size:30px;line-height:1}
#hud .dim{color:var(--dim);font-weight:500}
#msg{position:fixed;left:0;right:0;bottom:max(8vh,env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#msg h1{margin:0;font-size:clamp(28px,6vw,64px);letter-spacing:.12em;text-wrap:balance}
#msg p{margin:6px 0 0;color:var(--dim);font-size:clamp(13px,1.8vw,17px);font-weight:500}
#msg .res{display:inline-grid;grid-template-columns:auto auto;gap:2px 18px;margin-top:10px;font-size:15px;text-align:left;font-variant-numeric:tabular-nums}
#msg .medal{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:999px;font-weight:700;letter-spacing:.1em}
#keys{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));color:var(--dim);font-size:12px;font-weight:500;text-align:right;pointer-events:none;line-height:1.5}

<script>
'use strict';
// ===================== 調整値 =====================
const T = {
  W: 1280, H: 720,     // 部屋の論理サイズ
  HEAD_R: 4,           // 当たり判定半径（カーソル点）
  PAD_R: 46,           // スタート/CP/出口パッド半径
  TRAIL_LIFE: 0.7,     // 尻尾ドットが消えるまでの秒
  TRAIL_GAP: 5,        // ドットを落とす間隔(px)
  TRAIL_R: 5,          // ドット半径
  COUNTDOWN: 2.0,      // スタートパッド静止秒
  GHOST_HZ: 30,        // ゴースト記録レート
  POS_HZ: 20,          // マルチ: カーソル送信レート
};
const COURSE_VER = 'v0.2';

// ===================== ピース =====================
// wall    静止矩形                 x,y,w,h
// slider  矩形が往復               x,y,w,h,dx,dy,period,phase
// bar     線分が回転               x,y,len,thick,rpm,phase, blades(羽根数), anchor:'end'(端を軸に)
// pulser  円が脈動                 x,y,rmin,rmax,period,phase
// orbit   円が円軌道を周回         x,y,R,r,rpm,phase
// gate    レーザー線が点滅         ax,ay,bx,by,thick,period,duty,phase
// blink   壁が点滅                 x,y,w,h,period,duty,phase
// shooter 弾を一定間隔で発射       x,y,dx,dy(単位方向),speed,interval,r,range,phase
const TAU = Math.PI * 2;
function osc(t, period, phase){ return (1 - Math.cos(TAU * (t / period + (phase || 0)))) / 2; }
function frac(v){ return (v % 1 + 1) % 1; }
function prims(room, t){
  const out = [];
  for (const p of room.pieces){
    switch (p.t){
      case 'wall': out.push({ k: 'rect', x: p.x, y: p.y, w: p.w, h: p.h, c: 'wall', src: p }); break;
      case 'slider': { const s = osc(t, p.period, p.phase);
        out.push({ k: 'rect', x: p.x + (p.dx || 0) * s, y: p.y + (p.dy || 0) * s, w: p.w, h: p.h, c: 'haz', src: p }); break; }
      case 'bar': { const n = p.blades || 1, base = (p.phase || 0) * TAU + t * p.rpm * TAU / 60;
        for (let k = 0; k < n; k++){ const a = base + k * TAU / n, cx = Math.cos(a), sy = Math.sin(a);
          if (p.anchor === 'end') out.push({ k: 'cap', ax: p.x, ay: p.y, bx: p.x + cx * p.len, by: p.y + sy * p.len, r: p.thick / 2, c: 'haz', src: p });
          else out.push({ k: 'cap', ax: p.x - cx * p.len / 2, ay: p.y - sy * p.len / 2, bx: p.x + cx * p.len / 2, by: p.y + sy * p.len / 2, r: p.thick / 2, c: 'haz', src: p }); }
        break; }
      case 'pulser': { const s = osc(t, p.period, p.phase);
        out.push({ k: 'circ', x: p.x, y: p.y, r: p.rmin + (p.rmax - p.rmin) * s, c: 'haz', src: p }); break; }
      case 'orbit': { const a = (p.phase || 0) * TAU + t * p.rpm * TAU / 60;
        out.push({ k: 'circ', x: p.x + Math.cos(a) * p.R, y: p.y + Math.sin(a) * p.R, r: p.r, c: 'haz', src: p }); break; }
      case 'gate': { const on = frac(t / p.period + (p.phase || 0)) < p.duty;
        out.push({ k: 'cap', ax: p.ax, ay: p.ay, bx: p.bx, by: p.by, r: p.thick / 2, c: 'laser', on, src: p }); break; }
      case 'blink': { const on = frac(t / p.period + (p.phase || 0)) < p.duty;
        out.push({ k: 'rect', x: p.x, y: p.y, w: p.w, h: p.h, c: 'blink', on, src: p }); break; }
      case 'shooter': { const nb = Math.ceil(p.range / (p.speed * p.interval)), f = frac(t / p.interval + (p.phase || 0));
        for (let k = 0; k < nb; k++){ const d = (f + k) * p.interval * p.speed; if (d > p.range) break;
          out.push({ k: 'circ', x: p.x + p.dx * d, y: p.y + p.dy * d, r: p.r, c: 'haz', src: p }); }
        break; }
    }
  }
  return out;
}
// 設置の検証（server.js と同じもの）
function bounds(p){
  switch (p.t){
    case 'wall': case 'blink': return { x: p.x, y: p.y, w: p.w, h: p.h };
    case 'slider': return { x: p.x + Math.min(0, p.dx || 0), y: p.y + Math.min(0, p.dy || 0), w: p.w + Math.abs(p.dx || 0), h: p.h + Math.abs(p.dy || 0) };
    case 'bar': { const r = (p.anchor === 'end' ? p.len : p.len / 2) + p.thick / 2; return { x: p.x - r, y: p.y - r, w: 2 * r, h: 2 * r }; }
    case 'pulser': return { x: p.x - p.rmax, y: p.y - p.rmax, w: 2 * p.rmax, h: 2 * p.rmax };
    case 'orbit': { const r = p.R + p.r; return { x: p.x - r, y: p.y - r, w: 2 * r, h: 2 * r }; }
    case 'gate': { const r = p.thick / 2; return { x: Math.min(p.ax, p.bx) - r, y: Math.min(p.ay, p.by) - r, w: Math.abs(p.ax - p.bx) + 2 * r, h: Math.abs(p.ay - p.by) + 2 * r }; }
    case 'shooter': { const ex = p.x + p.dx * p.range, ey = p.y + p.dy * p.range, r = p.r; return { x: Math.min(p.x, ex) - r, y: Math.min(p.y, ey) - r, w: Math.abs(ex - p.x) + 2 * r, h: Math.abs(ey - p.y) + 2 * r }; }
  }
  return { x: p.x, y: p.y, w: 0, h: 0 };
}
function translate(p, cx, cy){ const q = { ...p }; if (p.t === 'gate'){ q.ax += cx; q.bx += cx; q.ay += cy; q.by += cy; } else { q.x += cx; q.y += cy; } return q; }
function rectCircleClear(b, c, r){ const dx = Math.max(b.x - c.x, 0, c.x - (b.x + b.w)), dy = Math.max(b.y - c.y, 0, c.y - (b.y + b.h)); return Math.hypot(dx, dy) > r; }
function placementOk(rel, cx, cy, start, goal){
  if (cx < 0 || cy < 0 || cx > T.W || cy > T.H) return false;
  const p = translate(rel, cx, cy), b = bounds(p), mustFit = p.t === 'wall' || p.t === 'blink' || p.t === 'slider' || p.t === 'gate';
  if (mustFit && (b.x < 0 || b.y < 0 || b.x + b.w > T.W || b.y + b.h > T.H)) return false;
  return rectCircleClear(b, start, T.PAD_R + 10) && rectCircleClear(b, goal, T.PAD_R + 10);
}

// ===================== 幾何 =====================
function segPointDist(ax, ay, bx, by, px, py){
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let u = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; u = u < 0 ? 0 : u > 1 ? 1 : u;
  const x = ax + dx * u - px, y = ay + dy * u - py; return Math.hypot(x, y);
}
function orient(ax, ay, bx, by, cx, cy){ return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax); }
function segIntersect(ax, ay, bx, by, cx, cy, dx, dy){
  const o1 = orient(ax, ay, bx, by, cx, cy), o2 = orient(ax, ay, bx, by, dx, dy), o3 = orient(cx, cy, dx, dy, ax, ay), o4 = orient(cx, cy, dx, dy, bx, by);
  return (o1 * o2 < 0) && (o3 * o4 < 0);
}
function segSegDist(ax, ay, bx, by, cx, cy, dx, dy){
  if (segIntersect(ax, ay, bx, by, cx, cy, dx, dy)) return 0;
  return Math.min(segPointDist(ax, ay, bx, by, cx, cy), segPointDist(ax, ay, bx, by, dx, dy), segPointDist(cx, cy, dx, dy, ax, ay), segPointDist(cx, cy, dx, dy, bx, by));
}
// Liang–Barsky: 線分 vs 矩形（点なら内包判定になる）
function segRect(x0, y0, x1, y1, xmin, ymin, xmax, ymax){
  let t0 = 0, t1 = 1; const dx = x1 - x0, dy = y1 - y0;
  const p = [-dx, dx, -dy, dy], q = [x0 - xmin, xmax - x0, y0 - ymin, ymax - y0];
  for (let i = 0; i < 4; i++){
    if (p[i] === 0){ if (q[i] < 0) return false; }
    else { const r = q[i] / p[i]; if (p[i] < 0){ if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; } }

}
// 掃引: 前位置 a → 現位置 b の線分（半径 r）がプリミティブに触れるか

  if (pr.k === 'circ') return segPointDist(ax, ay, bx, by, pr.x, pr.y) <= pr.r + r;

// ===================== 更新（シングル） =====================
let lastNow = performance.now();
function hazardTime(now){
  if (state === 'race' || state === 'dead' || state === 'done') return elapsed;
  if (state === 'count') return 0;
  return now / 1000; // タイトル中はプレビューで動かす
}
function update(now){
  const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
  if (state === 'mp'){ mpUpdate(now, dt); return; }
  if (state === 'race' || state === 'dead') elapsed = (now - goTime) / 1000;
  const room = ROOMS[roomIdx], ht = hazardTime(now), ps = state === 'menu' ? [] : prims(room, ht);
  const prevCur = { x: cur.x, y: cur.y };

  for (const s of samples){
    if (s.out){ if (state === 'race') die('out'); else if (state === 'count'){ state = 'title'; falseStarts++; flyFlash = 1; setMsg(); } have = false; continue; }
    have = true;
    if (state === 'race'){
      const h = sweepHit(ps, cur.x, cur.y, s.x, s.y);
      if (h){ cur = s; die(h); continue; }
    }
    cur = s;
    if (state !== 'dead') dropDot(trail, cur.x, cur.y, now);
    if (state === 'title'){ if (dist(cur, START) < T.PAD_R){ state = 'count'; countEnd = now + T.COUNTDOWN * 1000; setMsg(); } }
    else if (state === 'count'){ if (dist(cur, START) > T.PAD_R){ state = 'title'; falseStarts++; flyFlash = 1; setMsg(); } }
    else if (state === 'dead'){ if (dist(cur, cp) < T.PAD_R * 0.8) state = 'race'; }
  }
  samples.length = 0;
  if (state === 'menu'){
    for (const c of clicks){ for (const card of menuCards()) if (inRect(c, card)){ if (card.kind === 'course') selectCourse(card.c); else mpEnter(); } }
  }
  clicks.length = 0;
  if (state === 'mp'){ draw(now, null, [], 0); return; }
  speed = dt > 0 ? dist(prevCur, cur) / dt : 0; if (state === 'race') maxSpeed = Math.max(maxSpeed, speed);

  if (state === 'count' && now >= countEnd){ state = 'race'; goTime = now; elapsed = 0; gRec = []; gLastT = -1; gi = 0; gTrail = []; }
  if (state === 'race' && have){
    // 静止中に突っ込んでくる障害物
    const h = sweepHit(ps, cur.x, cur.y, cur.x, cur.y); if (h) die(h);
  }
  if (state === 'race'){
    for (const c of room.cps){ if (dist(cur, c) < T.PAD_R && !cpsHit.has(c)){ cpsHit.add(c); cp = c; } }
    if (dist(cur, room.exit) < T.PAD_R){
      if (roomIdx === ROOMS.length - 1) finish(); else { splits.push(elapsed); enterRoom(roomIdx + 1); }
    }
  }
  // ゴースト記録
  if ((state === 'race' || state === 'dead') && elapsed - gLastT >= 1 / T.GHOST_HZ){ gLastT = elapsed; gRec.push(Math.round(elapsed * 1000), roomIdx, Math.round(cur.x), Math.round(cur.y), state === 'race' ? 1 : 0); }

  pruneTrail(trail, now); pruneTrail(gTrail, now);
  stepParticles(dt);
  flyFlash = Math.max(0, flyFlash - dt * 2);

  // HUD
  const inMenu = state === 'menu';
  H.time.textContent = inMenu ? '' : fmt(state === 'done' ? finalTime : elapsed);
  H.room.textContent = inMenu ? '' : `ROOM ${roomIdx + 1}/${ROOMS.length}`; H.name.textContent = inMenu ? '' : `${course.name} · ${room.name}`;
  H.deaths.textContent = deaths; H.best.textContent = best ? fmt(best.time) : '--';
  if (debug) H.dbg.textContent = `speed ${Math.round(speed)} px/s · max ${Math.round(maxSpeed)} · false starts ${falseStarts} · state ${state}`;
  draw(now, room, ps, ht);
}
function stepParticles(dt){
  for (const p of particles){ p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
}

// ===================== マルチプレイ（Ultimate Chicken Horse 方式） =====================
// サーバー(server.js)がフェーズを進め、クライアントは当たり判定と申告を担当する。
const MP = { ws: null, id: null, offset: 0, snap: null, me: null, others: {}, status: 'idle', posT: 0, note: '', noteT: 0 };
const MP_START = { x: 90, y: 360 }, MP_GOAL = { x: 1190, y: 360 };
const PHASE_LABEL = { lobby: 'LOBBY', box: 'ピースを選べ', place: '設置せよ', count: 'スタートパッドに乗れ', run: 'GO', results: 'RESULT', final: 'WINNER' };
function myName(){
  const u = new URLSearchParams(location.search).get('name'); if (u) return u.slice(0, 12);
  let n = null; try { n = localStorage.getItem('cursorrun.name'); } catch (e) {}
  if (!n){ const L = ['ひよこ', 'うま', 'ねこ', 'いぬ', 'かえる', 'さる', 'きつね', 'くま']; n = L[Math.floor(Math.random() * L.length)] + Math.floor(10 + Math.random() * 90); try { localStorage.setItem('cursorrun.name', n); } catch (e) {} }
  return n;
}
function mpNote(s, ms){ MP.note = s; MP.noteT = ms === Infinity ? Infinity : performance.now() + (ms || 2000); }
function mpSend(o){ if (MP.ws && MP.ws.readyState === 1) MP.ws.send(JSON.stringify(o)); }
function serverNow(){ return Date.now() + MP.offset; }
function mpEnter(){
  state = 'mp'; trail = []; particles = []; deaths = 0; MP.snap = null; MP.me = null; MP.others = {}; MP.status = 'idle'; H.line3.hidden = true; setMsg();
  if (!/^https?:$/.test(location.protocol)){ mpNote('ONLINE は node server.js で起動した http://localhost:8080 で開くと遊べます（M でメニュー）', Infinity); return; }
  mpNote('接続中…', Infinity);
  try {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host); MP.ws = ws;
    ws.onopen = () => { mpNote('', 0); ws.send(JSON.stringify({ t: 'join', room: new URLSearchParams(location.search).get('room') || 'main', name: myName() })); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } mpMsg(m); };
    ws.onerror = () => mpNote('サーバーに接続できません。node server.js で起動したURLで開いてください（M でメニュー）', Infinity);
    ws.onclose = () => { MP.ws = null; if (state === 'mp' && MP.snap) mpNote('切断されました（M でメニュー）', Infinity); };
  } catch (e) { mpNote('WebSocket を開けません（M でメニュー）', Infinity); }
}
function mpLeave(){ if (MP.ws){ MP.ws.onclose = null; MP.ws.close(); MP.ws = null; } toMenu(); }
function mpMsg(m){
  if (m.t === 'hello'){ MP.id = m.id; MP.offset = m.now - Date.now(); }
  else if (m.t === 'state'){
    MP.offset = m.now - Date.now();
    const prev = MP.snap; MP.snap = m; MP.me = m.players.find(p => p.id === MP.id) || null;
    if (!prev || prev.phase !== m.phase){
      if (m.phase === 'count'){ MP.status = 'waiting'; trail = []; particles = []; }
      if (m.phase === 'box' || m.phase === 'lobby') MP.status = 'idle';
      if (m.phase === 'results' || m.phase === 'final') for (const id in MP.others) MP.others[id].trail = [];
    }
    for (const id in MP.others) if (!m.players.some(p => p.id === id)) delete MP.others[id];
  }
  else if (m.t === 'pos'){ const o = MP.others[m.id] || (MP.others[m.id] = { x: m.x, y: m.y, trail: [] }); o.x = m.x; o.y = m.y; dropDot(o.trail, m.x, m.y, performance.now()); }
  else if (m.t === 'reject') mpNote('そこには置けない');
  else if (m.t === 'full') mpNote('部屋が満員です（M でメニュー）', Infinity);
}
function mpKeyReady(){ if (MP.snap && MP.snap.phase === 'lobby') mpSend({ t: 'ready' }); }
function mpKeyPass(){ if (MP.snap && MP.snap.phase === 'place' && MP.me && !MP.me.placed) mpSend({ t: 'pass' }); }
function mpHazardTime(){
  const s = MP.snap; if (!s) return 0;
  if (s.phase === 'count') return 0;
  if (s.phase === 'run' || s.phase === 'results' || s.phase === 'final') return Math.max(0, (serverNow() - s.runStart) / 1000);
  return serverNow() / 1000; // 設置中はサーバー時刻で同期したプレビュー
}
function mpDie(h){
  MP.status = 'dead'; deaths++;
  mpSend({ t: 'dead', by: h && h.src && h.src.owner ? h.src.owner : null });
  burst(MP.me ? MP.me.color : '#5ee1ff');
}
const mpReadyBtn = () => ({ x: 540, y: 600, w: 200, h: 60 });
function mpBoxCards(){
  const s = MP.snap, n = s.box.length, gap = 20, w = Math.min(200, (T.W - 80 - (n - 1) * gap) / n), h = 170, x0 = (T.W - (n * w + (n - 1) * gap)) / 2, y = 290;
  return s.box.map((b, i) => ({ x: x0 + i * (w + gap), y, w, h }));
}
function mpUpdate(now, dt){
  const s = MP.snap, phase = s ? s.phase : 'connecting', ht = mpHazardTime();
  const level = s ? s.level : [], ps = prims({ pieces: level }, ht);
  const racing = phase === 'run' && MP.status === 'running';
  for (const smp of samples){
    if (smp.out){ if (racing) mpDie(null); have = false; continue; }
    have = true;
    if (phase === 'run' && MP.status === 'running'){ const h = sweepHit(ps, cur.x, cur.y, smp.x, smp.y); if (h){ cur = smp; mpDie(h); continue; } }
    cur = smp; if (MP.status !== 'dead') dropDot(trail, cur.x, cur.y, now);
  }
  samples.length = 0;
  if (phase === 'run' && MP.status === 'running' && have){ const h = sweepHit(ps, cur.x, cur.y, cur.x, cur.y); if (h) mpDie(h); }
  if (phase === 'run' && MP.status === 'waiting' && have && dist(cur, MP_START) < T.PAD_R){ MP.status = 'running'; mpSend({ t: 'start' }); }
  if (phase === 'run' && MP.status === 'running' && dist(cur, MP_GOAL) < T.PAD_R){ MP.status = 'finished'; mpSend({ t: 'finish' }); }
  for (const c of clicks){
    if (!s) continue;
    if (phase === 'lobby'){ if (inRect(c, mpReadyBtn())) mpSend({ t: 'ready' }); }
    else if (phase === 'box' && MP.me && MP.me.pick === null){ mpBoxCards().forEach((card, i) => { if (inRect(c, card) && s.box[i].takenBy === null) mpSend({ t: 'pick', i }); }); }
    else if (phase === 'place' && MP.me && MP.me.pick !== null && !MP.me.placed){
      const rel = s.box[MP.me.pick].piece;
      if (placementOk(rel, c.x, c.y, MP_START, MP_GOAL)) mpSend({ t: 'place', x: Math.round(c.x), y: Math.round(c.y) }); else mpNote('そこには置けない');
    }
  }
  clicks.length = 0;
  if (have && now - MP.posT > 1000 / T.POS_HZ){ MP.posT = now; mpSend({ t: 'pos', x: Math.round(cur.x), y: Math.round(cur.y) }); }
  pruneTrail(trail, now); for (const id in MP.others) pruneTrail(MP.others[id].trail, now);
  stepParticles(dt);
  // HUD
  const left = s ? Math.max(0, (s.deadline - serverNow()) / 1000) : 0;
  H.time.textContent = !s ? '' : phase === 'run' ? fmt(Math.max(0, (serverNow() - s.runStart) / 1000)) : phase === 'count' ? Math.ceil(left) + '' : left.toFixed(0);
  H.room.textContent = s ? `ROUND ${s.round}` : 'ONLINE'; H.name.textContent = s && MP.me ? `${MP.me.name} · ${MP.me.score} / ${s.target} pt` : '';
  if (debug) H.dbg.textContent = `phase ${phase} · status ${MP.status} · offset ${Math.round(MP.offset)}ms`;
  draw(now, null, ps, ht, level);
}

function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
const C = {};
function cacheColors(){ for (const n of ['arena','grid','wall','wall-edge','haz','laser','start','cp','exit','player','ghost','dim','fg','card','card-hi']) C[n] = css('--' + n); }
cacheColors();

function pad(x, y, r, color, label, strong){
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = color; ctx.globalAlpha = strong ? 0.28 : 0.1; ctx.fill();
  ctx.globalAlpha = strong ? 1 : 0.5; ctx.lineWidth = 3; ctx.strokeStyle = color; ctx.stroke();
  if (label){ ctx.globalAlpha = strong ? 1 : 0.6; ctx.fillStyle = color; ctx.font = '700 13px ' + css('--font'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y); }
  ctx.restore();
}
function goal(x, y, r){
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  const n = 8, s = (r * 2) / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){ ctx.fillStyle = (i + j) % 2 ? '#f2f4f8' : '#1a1f2c'; ctx.fillRect(x - r + i * s, y - r + j * s, s, s); }
  ctx.restore(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.lineWidth = 3; ctx.strokeStyle = C.exit; ctx.stroke();
}
function drawTrail(tr, color, alpha, now){
  if (!tr.length) return;
  ctx.save(); ctx.fillStyle = color;
  for (const d of tr){
    const f = 1 - (now - d.t) / (T.TRAIL_LIFE * 1000); if (f <= 0) continue;
    ctx.globalAlpha = alpha * f; ctx.beginPath(); ctx.arc(d.x, d.y, T.TRAIL_R * (0.3 + 0.7 * f), 0, TAU); ctx.fill();
  }
  ctx.restore();
}

}
function ghostPose(){
  if (!best || !ghostOn || !(state === 'race' || state === 'dead')) return null;
  const s = best.s, n = s.length / 5, ms = elapsed * 1000;
  while (gi + 1 < n && s[(gi + 1) * 5] <= ms) gi++;
  if (gi >= n) return null;
  const a = gi * 5, b = Math.min(n - 1, gi + 1) * 5;
  if (s[a + 1] !== roomIdx) return { room: s[a + 1] };
  let x = s[a + 2], y = s[a + 3];
  if (s[b + 1] === roomIdx && s[b] > s[a]){ const u = Math.min(1, (ms - s[a]) / (s[b] - s[a])); x += (s[b + 2] - x) * u; y += (s[b + 3] - y) * u; }
  return { room: roomIdx, x, y, alive: s[a + 4] === 1 };
}
function text(str, x, y, size, color, align, weight){

// ピース群の描画（ガイド → 本体 → 砲台の台座）
function drawPieces(pieces, ps){
  ctx.save(); ctx.strokeStyle = C.haz; ctx.fillStyle = C.haz;
  for (const p of pieces){
    if (p.t === 'orbit'){ ctx.beginPath(); ctx.arc(p.x, p.y, p.R, 0, TAU); ctx.globalAlpha = 0.18; ctx.setLineDash([6, 8]); ctx.stroke(); ctx.setLineDash([]); }
    if (p.t === 'slider'){ ctx.globalAlpha = 0.06; ctx.fillRect(p.x + Math.min(0, p.dx || 0), p.y + Math.min(0, p.dy || 0), p.w + Math.abs(p.dx || 0), p.h + Math.abs(p.dy || 0)); }
    if (p.t === 'pulser'){ ctx.beginPath(); ctx.arc(p.x, p.y, p.rmax, 0, TAU); ctx.globalAlpha = 0.15; ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]); }
    if (p.t === 'shooter'){ ctx.globalAlpha = 0.12; ctx.setLineDash([4, 10]); ctx.lineWidth = p.r * 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.dx * p.range, p.y + p.dy * p.range); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1; }
    if (p.t === 'bar' && p.anchor === 'end'){ ctx.beginPath(); ctx.arc(p.x, p.y, p.len, 0, TAU); ctx.globalAlpha = 0.1; ctx.setLineDash([6, 8]); ctx.stroke(); ctx.setLineDash([]); }
  }
  ctx.restore();
  for (const pr of ps){
    if (pr.k === 'rect'){
      if (pr.c === 'wall'){ ctx.fillStyle = C.wall; ctx.fillRect(pr.x, pr.y, pr.w, pr.h); ctx.strokeStyle = C['wall-edge']; ctx.lineWidth = 2; ctx.strokeRect(pr.x + 1, pr.y + 1, pr.w - 2, pr.h - 2); }
      else if (pr.c === 'blink'){
        if (pr.on){ ctx.save(); ctx.shadowColor = C.haz; ctx.shadowBlur = 12; ctx.fillStyle = C.haz; ctx.fillRect(pr.x, pr.y, pr.w, pr.h); ctx.restore(); }
        else { ctx.save(); ctx.globalAlpha = 0.25; ctx.strokeStyle = C.haz; ctx.lineWidth = 2; ctx.setLineDash([4, 6]); ctx.strokeRect(pr.x, pr.y, pr.w, pr.h); ctx.restore(); }
      }
      else { ctx.save(); ctx.shadowColor = C.haz; ctx.shadowBlur = 14; ctx.fillStyle = C.haz; ctx.fillRect(pr.x, pr.y, pr.w, pr.h); ctx.restore(); }
    } else if (pr.k === 'circ'){
      ctx.save(); ctx.shadowColor = C.haz; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, TAU); ctx.fillStyle = C.haz; ctx.fill(); ctx.restore();
    } else if (pr.k === 'cap'){
      ctx.save(); ctx.lineCap = 'round';
      if (pr.c === 'laser'){
        if (pr.on){ ctx.shadowColor = C.laser; ctx.shadowBlur = 16; ctx.strokeStyle = C.laser; ctx.lineWidth = pr.r * 2; }
        else { ctx.strokeStyle = C.laser; ctx.globalAlpha = 0.25; ctx.lineWidth = 2; ctx.setLineDash([4, 8]); }
      } else { ctx.shadowColor = C.haz; ctx.shadowBlur = 14; ctx.strokeStyle = C.haz; ctx.lineWidth = pr.r * 2; }
      ctx.beginPath(); ctx.moveTo(pr.ax, pr.ay); ctx.lineTo(pr.bx, pr.by); ctx.stroke(); ctx.restore();
      if (pr.src && pr.src.t === 'bar'){ ctx.beginPath(); ctx.arc(pr.src.x, pr.src.y, pr.r + 4, 0, TAU); ctx.fillStyle = '#1a1f2c'; ctx.fill(); ctx.strokeStyle = C.haz; ctx.lineWidth = 2; ctx.stroke(); }
    }
  }
  for (const p of pieces) if (p.t === 'shooter'){ ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 6, 0, TAU); ctx.fillStyle = '#1a1f2c'; ctx.fill(); ctx.strokeStyle = C.haz; ctx.lineWidth = 3; ctx.stroke(); }
}
function pieceAnchor(p){ return p.t === 'gate' ? { x: (p.ax + p.bx) / 2, y: (p.ay + p.by) / 2 } : { x: p.x + (p.w ? p.w / 2 : 0), y: p.y + (p.h ? p.h / 2 : 0) }; }

function drawSingle(now, room, ps){
  if (flyFlash > 0){ ctx.fillStyle = C.haz; ctx.globalAlpha = flyFlash * 0.25; ctx.fillRect(0, 0, T.W, T.H); ctx.globalAlpha = 1; }
  const entry = roomEntry(roomIdx);
  if (roomIdx === 0) pad(START.x, START.y, T.PAD_R, C.start, state === 'count' ? Math.ceil((countEnd - now) / 1000) + '' : 'START', state !== 'race');
  else pad(entry.x, entry.y, T.PAD_R, C.cp, 'IN', cp === entry);
  for (const c of room.cps) pad(c.x, c.y, T.PAD_R, C.cp, 'CP', cp === c);
  if (roomIdx === ROOMS.length - 1) goal(room.exit.x, room.exit.y, T.PAD_R); else pad(room.exit.x, room.exit.y, T.PAD_R, C.exit, 'EXIT', true);
  if (state === 'dead'){ // 戻り先を強調
    const pulse = 0.5 + 0.5 * Math.sin(now / 120);
    ctx.beginPath(); ctx.arc(cp.x, cp.y, T.PAD_R + 6 + pulse * 10, 0, TAU); ctx.strokeStyle = C.cp; ctx.lineWidth = 2; ctx.globalAlpha = 0.6 + 0.4 * pulse; ctx.stroke(); ctx.globalAlpha = 1;
  }
  drawPieces(room.pieces, ps);
  const g = ghostPose();
  if (g && g.room === roomIdx){
    if (g.alive) dropDot(gTrail, g.x, g.y, now);
    drawTrail(gTrail, C.ghost, 0.5, now); head(g.x, g.y, C.ghost, 0.6, !g.alive);
  } else gTrail = [];
  if (deathMark && state === 'dead'){ ctx.beginPath(); ctx.moveTo(deathMark.x - 9, deathMark.y - 9); ctx.lineTo(deathMark.x + 9, deathMark.y + 9); ctx.moveTo(deathMark.x + 9, deathMark.y - 9); ctx.lineTo(deathMark.x - 9, deathMark.y + 9); ctx.strokeStyle = C.haz; ctx.lineWidth = 3; ctx.stroke(); }
  drawParticles();
  drawTrail(trail, C.player, 0.9, now);
  if (have){
    head(cur.x, cur.y, state === 'dead' ? C.ghost : C.player, 1, state === 'dead');
    if (debug){ ctx.beginPath(); ctx.arc(cur.x, cur.y, T.HEAD_R, 0, TAU); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke(); }
  }
}
function drawParticles(){
  for (const p of particles){ ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c === 'haz' ? C.haz : p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
}
function panel(x, y, w, h){ ctx.fillStyle = 'rgba(7,9,15,0.82)'; ctx.strokeStyle = C['wall-edge']; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke(); }
function drawMulti(now, ps, ht, level){
  const s = MP.snap, phase = s ? s.phase : 'connecting', pl = s ? s.players : [], colorOf = id => (pl.find(p => p.id === id) || {}).color || C.ghost;

    pad(MP_START.x, MP_START.y, T.PAD_R, C.start, phase === 'count' ? Math.ceil(Math.max(0, (s.deadline - serverNow()) / 1000)) + '' : 'START', phase === 'count' || phase === 'run');
    goal(MP_GOAL.x, MP_GOAL.y, T.PAD_R);
    drawPieces(level, ps);
    for (const p of level) if (p.owner){ const a = pieceAnchor(p); ctx.beginPath(); ctx.arc(a.x, a.y, 5, 0, TAU); ctx.fillStyle = colorOf(p.owner); ctx.fill(); }
    // 設置プレビュー

      const rel = s.box[MP.me.pick].piece, ok = placementOk(rel, cur.x, cur.y, MP_START, MP_GOAL), piece = translate(rel, cur.x, cur.y), b = bounds(piece);

  drawParticles();
  drawTrail(trail, myColor, 0.9, now);
  if (have && phase !== 'connecting') head(cur.x, cur.y, MP.status === 'dead' ? C.ghost : myColor, 1, MP.status === 'dead');
  // バナー
  if (s){
    const left = Math.max(0, (s.deadline - serverNow()) / 1000);
    if (phase !== 'lobby' && phase !== 'results' && phase !== 'final'){
      text(PHASE_LABEL[phase] || phase, T.W / 2, 34, 26, C.fg, 'center');

      if (phase === 'place') text(MP.me && MP.me.placed ? '他のプレイヤーを待っています' : 'クリックで設置 · Space で捨てる', T.W / 2, T.H - 24, 14, C.dim, 'center', 500);

      const y = sb.y + 24 + i * 26, mark = phase === 'lobby' ? (p.ready ? '✓' : '…') : phase === 'box' ? (p.pick !== null ? '✓' : '…') : phase === 'place' ? (p.placed ? '✓' : '…') : (phase === 'run' || phase === 'count') ? ({ waiting: '…', running: '▶', dead: '✕', finished: '★', out: '－' }[p.status] || '') : '';
      ctx.beginPath(); ctx.arc(sb.x + 18, y, 6, 0, TAU); ctx.fillStyle = p.color; ctx.fill();

      pl.forEach((p, i) => { const y = 330 + i * 34; ctx.beginPath(); ctx.arc(T.W / 2 - 120, y, 8, 0, TAU); ctx.fillStyle = p.color; ctx.fill(); text(p.name, T.W / 2 - 100, y, 20, C.fg); text(p.ready ? 'READY' : '', T.W / 2 + 60, y, 16, C.start); });
      const b = mpReadyBtn(), hover = have && inRect(cur, b), ready = MP.me && MP.me.ready;

      text(ready ? 'READY ✓' : 'READY', b.x + b.w / 2, b.y + b.h / 2, 22, ready ? '#111' : C.fg, 'center');
      text('Enter でも可 · 全員 READY で開始', T.W / 2, 690, 13, C.dim, 'center', 500);
    }

        const b = s.box[i], taken = b.takenBy !== null, mine = b.takenBy === MP.id, hover = have && inRect(cur, card) && !taken;
        ctx.fillStyle = hover ? C['card-hi'] : C.card; ctx.strokeStyle = mine ? C.start : taken ? colorOf(b.takenBy) : hover ? C.player : C['wall-edge']; ctx.lineWidth = taken || hover ? 3 : 2;
        ctx.beginPath(); ctx.roundRect(card.x, card.y, card.w, card.h, 10); ctx.fill(); ctx.stroke();
        text(b.name, card.x + card.w / 2, card.y + 22, 15, taken ? C.dim : C.fg, 'center');
        // ミニプレビュー
        const bb = bounds(b.piece), sc = Math.min(0.32, (card.w - 30) / Math.max(1, bb.w), (card.h - 70) / Math.max(1, bb.h));

        if (taken) ctx.globalAlpha = 0.35; drawPieces([b.piece], prims({ pieces: [b.piece] }, ht)); ctx.restore();

    }

        text(row.notes.join('  '), x0 + 320, y, 13, C.dim, 'left', 500);

  }
  if (MP.note && performance.now() < MP.noteT){ panel(T.W / 2 - 360, T.H - 90, 720, 44); text(MP.note, T.W / 2, T.H - 68, 15, C.fg, 'center', 500); }
}

function draw(now, room, ps, ht, level){
  const { s, ox, oy, dpr } = view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, ox * dpr, oy * dpr);
  // arena
  ctx.fillStyle = C.arena; ctx.fillRect(0, 0, T.W, T.H);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 80; x < T.W; x += 80){ ctx.moveTo(x, 0); ctx.lineTo(x, T.H); }
  for (let y = 80; y < T.H; y += 80){ ctx.moveTo(0, y); ctx.lineTo(T.W, y); }
  ctx.stroke();
  if (state === 'menu'){ drawMenu(now); drawTrail(trail, C.player, 0.9, now); if (have) head(cur.x, cur.y, C.player, 1, false); }
  else if (state === 'mp') drawMulti(now, ps, ht, level || []);
  else drawSingle(now, room, ps);
  // レターボックス外を暗く
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#07090f';
  if (ox > 0){ ctx.fillRect(0, 0, ox, cvs.height); ctx.fillRect(ox + T.W * s, 0, ox + 1, cvs.height); }
  if (oy > 0){ ctx.fillRect(0, 0, cvs.width, oy); ctx.fillRect(0, oy + T.H * s, cvs.width, oy + 1); }
}

if (!ctx.roundRect) ctx.roundRect = function(x, y, w, h, r){ this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
function loop(now){ try { update(now); } catch (e) { console.error(e); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
